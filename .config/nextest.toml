[profile.default]
slow-timeout = "60s"
# 降载纪律：newapi 同机，限制测试并行度
test-threads = 4

[profile.default.env]
# Test processes must never bootstrap the managed pinned bun download
# (Phase 10 packaging lane): the bun-spawning integration tests skip
# when bun is absent instead of fetching ~40 MiB from the network
# (MIGRATION §2.3 graceful degradation; oc-util::bunman kill switch).
set = { OPENCODE_DISABLE_BUN_DOWNLOAD = "1" }

# PTY integration suites spawn real terminals + stub servers; on shared
# CI runners their spawn timing occasionally trips the first attempt.
# Two retries keeps them in CI without masking real failures (a genuine
# break fails all three attempts).
[[profile.default.overrides]]
filter = 'test(mini_pty)'
retries = 2

[[profile.default.overrides]]
filter = 'test(pty_boot)'
retries = 2

[[profile.default.overrides]]
filter = 'test(pty_tabs)'
retries = 2

[[profile.default.overrides]]
filter = 'test(pty_interactions)'
retries = 2
