[profile.default]
# Warn at 60s; HARD KILL at 60s x 15 = 900s (terminate-after, the only
# hard-timeout mechanism nextest has — a `timeout` key does not exist).
# Backstop for pathological CI hangs (WIRE-BE1-FLAKE ran 900s+ on a
# 2-core runner 2026-10-19 while green on other runs).
slow-timeout = { period = "60s", terminate-after = 15 }
# Global single retry: parallel-spawn interference flakes (PTY/shared-CWD
# classes observed across oc-core/oc-cli/oc-server) pass on retry, while
# real failures fail consistently both attempts. Per-suite overrides
# below raise specific retries to 2.
retries = 1
# 降载纪律：newapi 同机，限制测试并行度
test-threads = 4

# NOTE: nextest has no profile-level env mechanism (0.9.148 verified —
# the previous [profile.default.env] block was silently ignored
# everywhere). OPENCODE_DISABLE_BUN_DOWNLOAD is set at the CI job level
# (.github/workflows/ci.yml); locally bun is pre-provisioned by bunman.

# PTY integration suites spawn real terminals + stub servers; on shared
# CI runners their spawn timing occasionally trips the first attempt.
# Two retries keeps them in CI without masking real failures (a genuine
# break fails all three attempts).
# be1 class: normally green <60s; a CI hang ran 900s+ (WIRE-BE1-FLAKE).
# 300s hard ceiling for this family converts a hang into a fast failure
# instead of eating a quarter of the job budget.
[[profile.default.overrides]]
filter = 'test(be1_)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'test(mini_pty)'
retries = 2

[[profile.default.overrides]]
filter = 'test(pty_boot)'
retries = 2

[[profile.default.overrides]]
filter = 'test(pty_tabs)'
retries = 2

[[profile.default.overrides]]
filter = 'test(pty_interactions)'
retries = 2

# lane/if: the input-foundations proofs (wheel / stale-registry /
# permission pointer / disclosures / dialog close) are the same
# spawn-contention class.
[[profile.default.overrides]]
filter = 'test(pty_lane_if)'
retries = 2

# lane PTYD D3: real-binary process-level daemon tests (oc-pty
# tests/process.rs) — same serialized real-process class as the PTY
# suites; the 8 MiB replay scenarios (i15/slow) read child output
# under load, the known first-attempt flake family.
[[profile.default.overrides]]
filter = 'test(pty_d3)'
retries = 2

# The invariant fuzzer drives the real binary through long key
# sequences: same serialized PTY class, and the 3-seed smoke needs a
# wider slow-timeout than the 60s default (it is one test fn).
[[profile.default.overrides]]
filter = 'test(pty_fuzz)'
retries = 2
slow-timeout = "15m"
# vt-stream lane: the cell-grid suites (hover band sweeps + temporal)
# are the same spawn-contention class; each test must also stay under
# 60 s (libtest's slow-test warning prints into the PTY and would
# poison the composer draft — see tests/vt_hover_sweep.rs header).
[[profile.default.overrides]]
filter = 'test(vt_hover)'
retries = 2

[[profile.default.overrides]]
filter = 'test(vt_temporal)'
retries = 2

# Same spawn/contention class as the PTY suites: the server integration
# pair (shell round-trip / vcs init) reads child output under 4-way
# parallel test load and can truncate on slow runners (observed locally
# under lane load and on CI).
[[profile.default.overrides]]
filter = 'test(handlers_shell_round_trip)'
retries = 2

[[profile.default.overrides]]
filter = 'test(handlers_vcs_init_and_status)'
retries = 2

# PTY/heavyweight integration profile: serialized (one at a time) — the
# spawn-contention flake class only appears under 4-way parallel load.
[profile.pty]
test-threads = 1
