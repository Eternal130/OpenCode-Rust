name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  guards:
    name: static anti-regression guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # §9.1/§9.3 static guards: stdlib-only python3, no bun/ref/cargo.
      # New violations or expired allowlist entries fail; baselines may
      # only shrink. env_inventory runs from its committed snapshot
      # (no reference checkout on runners).
      - name: Run guards
        run: tools/guards/run.sh

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          # One shared cache entry across jobs: dep artifacts compile
          # once and are reused by every job (per-job default keys made
          # each lane rebuild the chain independently).
          shared-key: opencode-ci

      # sccache: content-addressed compilation cache shared across ALL
      # jobs and runs (merges concurrent writers — the immutable
      # rust-cache entry cannot). Deps compile exactly once, ever; each
      # job then only compiles its own workspace crates.
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ONE compilation for the whole pipeline: nextest archive builds every
  # test binary once (debug workspace + release oc-tui for frame budget)
  # and ships them as an artifact; the three test jobs below run from the
  # archive with ZERO compilation. (Caches could never dedupe the three
  # concurrent per-job builds: GitHub cache entries are immutable and
  # same-run writes are invisible to sibling jobs.)
  build-archive:
    name: build + archive (single compile)
    runs-on: ubuntu-latest
    # A healthy archive build is well under 20 min; fail fast instead of
    # lingering (the 2026-10-19 zombie pile-up: a 30+ min wedged build
    # step + rapid pushes maximized the cancel-desync window).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: opencode-ci

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: taiki-e/install-action@v2
        with:
          # Pin to the dev-gate version (0.9.148): older builds silently
          # ignore profile.default.{env,timeout,overrides[].timeout} —
          # the hard-timeout backstops and bun kill-switch never applied.
          tool: cargo-nextest@0.9.148

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      # Build ALL test binaries once and ship the whole target dir.
      # (nextest ARCHIVE mode is incompatible with this suite: tests bake
      # env!("CARGO_BIN_EXE_*") build-time ABSOLUTE paths, which break when
      # archives extract elsewhere. A same-path target dir preserves every
      # spawn/compile-time-path semantic with ZERO test changes.)
      # debuginfo stripped on CI (env profile override — panic locations
      # unaffected, #[track_caller] is compiled in).
      - name: Build workspace test binaries (debug)
        run: cargo nextest run --workspace --locked --no-run
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"

      # (release build REMOVED 2026-10-19: a 20-min opt-level-3 chain that
      # cache eviction kept re-cold-starting. frame_budget now runs in
      # debug with a calibrated ceiling — regressions show in both.)

      - name: Prune non-relocatable artifacts
        # incremental dirs are machine-specific and huge; fingerprints
        # are kept so consumers do zero recompilation.
        run: rm -rf target/debug/incremental target/release/incremental

      - uses: actions/upload-artifact@v4
        with:
          name: build-target
          path: target/
          retention-days: 1
          include-hidden-files: false

  pty-integration:
    name: nextest (pty, serialized)
    needs: build-archive
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-target
          path: target

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      - uses: taiki-e/install-action@v2
        with:
          # Pin to the dev-gate version (0.9.148): older builds silently
          # ignore profile.default.{env,timeout,overrides[].timeout} —
          # the hard-timeout backstops and bun kill-switch never applied.
          tool: cargo-nextest@0.9.148

      - name: Run PTY integration suites (serialized + retries)
        run: cargo nextest run --workspace --locked --profile pty -E 'test(mini_pty) or test(pty_boot) or test(pty_tabs) or test(pty_interactions) or test(pty_fuzz) or test(vt_hover) or test(vt_temporal) or test(pty_d3) or binary(pty_daily) or binary(pty_form) or binary(pty_permission)'
        env:
          # Job-level: CI nextest ignores profile.default.env (see test job note)
          OPENCODE_DISABLE_BUN_DOWNLOAD: "1"

  test:
    name: nextest
    needs: build-archive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-target
          path: target

      # Tests stage scratch sandboxes under /tmp/opencode (PIDs-unique
      # names). The dev box pre-creates it; runners do not.
      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      # oc-plugin-host suites host TS plugins via bun. The download
      # kill-switch (OPENCODE_DISABLE_BUN_DOWNLOAD=1) is enforced below,
      # so provision the pinned bun (oc-util bunman BUN_VERSION) once
      # per job instead — tests that previously self-downloaded 40 MiB
      # (the profile env was silently ignored on runners) now use this.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: taiki-e/install-action@v2
        with:
          # Pin to the dev-gate version (0.9.148): older builds silently
          # ignore profile.default.{env,timeout,overrides[].timeout} —
          # the hard-timeout backstops and bun kill-switch never applied.
          tool: cargo-nextest@0.9.148

      - name: Run test suite
        # --retries 2: absorbs the ledger-tracked CI-timing flakes
        # (GATE-FLAKE-PERM-SAVED m1_scenario_permission_saved,
        # provider_refresh_engine_boot_loop 10s→30s budget class) while
        # those entries stay open for stabilization. Deterministic
        # failures are NOT masked by retries (both tries must pass).
        # OPENCODE_DISABLE_BUN_DOWNLOAD at job level: the CI nextest
        # warns "ignoring unknown configuration key: profile.default.env"
        # (.config/nextest.toml) — the profile env table does not apply
        # on runners, so enforce it here.
        run: cargo nextest run --workspace --locked --no-fail-fast --retries 2 -E 'not (test(mini_pty) or test(pty_boot) or test(pty_tabs) or test(pty_interactions) or test(pty_fuzz) or test(vt_hover) or test(vt_temporal) or test(pty_d3) or binary(pty_daily) or binary(pty_form) or binary(pty_permission))'
        env:
          OPENCODE_DISABLE_BUN_DOWNLOAD: "1"

  # Frame-budget runs RELEASE (the product profile; debug numbers are
  # informational only). Runs from the release archive — no compilation.
  frame-budget:
    name: frame budget (release)
    needs: build-archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-target
          path: target

      - uses: taiki-e/install-action@v2
        with:
          # Pin to the dev-gate version (0.9.148): older builds silently
          # ignore profile.default.{env,timeout,overrides[].timeout} —
          # the hard-timeout backstops and bun kill-switch never applied.
          tool: cargo-nextest@0.9.148

      - name: Frame budget guard (debug-calibrated)
        # Release chain removed from CI (20-min cold builds under cache
        # eviction). Debug is ~2-3x slower than the release profile the
        # nominal 40ms budget targets; combined with the ~2x slower
        # shared 2-core runners that is scale 4. Local release runs
        # stay strict. See frame_budget_tests.rs::frame_budget_ms.
        run: cargo nextest run -p oc-tui --locked -E 'test(frame_budget)'
        env:
          OC_FRAME_BUDGET_SCALE: "4"
          OPENCODE_DISABLE_BUN_DOWNLOAD: "1"
