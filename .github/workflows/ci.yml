name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fingerprint parity for artifact consumers: the archive build compiles
  # with debuginfo stripped (dee2ab7a). Every job that runs cargo against
  # the shipped target/ must resolve the SAME profile, or cargo declares
  # every unit stale and relinks the whole workspace on the runner —
  # the ubuntu-26.04 disk-death of run 42674936717 (linker SIGBUS).
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  guards:
    name: static anti-regression guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # §9.1/§9.3 static guards: stdlib-only python3, no bun/ref/cargo.
      # New violations or expired allowlist entries fail; baselines may
      # only shrink. env_inventory runs from its committed snapshot
      # (no reference checkout on runners).
      - name: Run guards
        run: tools/guards/run.sh

      # RA-08: the generated route/validation tables must match the pinned
      # spec — fails when openapi.json is updated without regeneration
      # (or regenerated with a stale spec). Needs cargo (dev-gate is a
      # local-only harness; CI calls cargo directly).
      - name: OpenAPI generation drift check
        run: cargo run -p openapi-gen --locked -- --check

  # G-27 — vendored ACP drift: third_party/agent-client-protocol must be
  # exactly crates.io 3.3.0 plus the committed LOCAL_CHANGES.patch (the
  # preserve_order-removal). Stdlib python3; sources the pristine crate
  # from the cargo registry cache, else downloads the checksum-pinned
  # .crate from static.crates.io (no cache on runners), applies the
  # committed patch to the pristine copy and diffs it against the
  # vendored tree. Any vendored edit without a patch update fails.
  acp-drift:
    name: vendored ACP drift check (G-27)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: vendored agent-client-protocol vs upstream 3.3.0 + LOCAL_CHANGES.patch
        run: python3 tools/guards/acp_drift.py

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          # One shared cache entry across jobs: dep artifacts compile
          # once and are reused by every job (per-job default keys made
          # each lane rebuild the chain independently).
          shared-key: opencode-ci

      # sccache: content-addressed compilation cache shared across ALL
      # jobs and runs (merges concurrent writers — the immutable
      # rust-cache entry cannot). Deps compile exactly once, ever; each
      # job then only compiles its own workspace crates.
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ONE compilation for the whole pipeline: nextest archive builds every
  # test binary once (debug workspace + release oc-tui for frame budget)
  # and ships them as an artifact; the three test jobs below run from the
  # archive with ZERO compilation. (Caches could never dedupe the three
  # concurrent per-job builds: GitHub cache entries are immutable and
  # same-run writes are invisible to sibling jobs.)
  build-archive:
    name: build + archive (single compile)
    runs-on: ubuntu-latest
    # A healthy archive build is well under 20 min; fail fast instead of
    # lingering (the 2026-10-19 zombie pile-up: a 30+ min wedged build
    # step + rapid pushes maximized the cancel-desync window).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: opencode-ci

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: taiki-e/install-action@v2
        with:
          # Pin to the dev-gate version (0.9.148): older builds silently
          # ignore profile.default.{env,timeout,overrides[].timeout} —
          # the hard-timeout backstops and bun kill-switch never applied.
          tool: cargo-nextest@0.9.148

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      # CI-06 (2026-11-25, iteration 4 — the definitive single-compile
      # mechanism). Three attempts to ship the target dir and let the
      # consumers' cargo judge it fresh all failed: the v4 zip drops
      # hidden fingerprint dirs; the zip drops exec bits; and mtime
      # parity cannot survive transit (run 45635029683: mtime-normalized
      # on both sides, frame-budget STILL rebuilt 307 units). nextest
      # ARCHIVES are immune by construction — `cargo nextest run
      # --archive-file` never touches cargo's build or freshness
      # machinery. The archive embeds the test binaries, the non-test
      # bins tests spawn via env!("CARGO_BIN_EXE_*") (opencode-rust,
      # oc-server, oc-pty), build-script outputs, and the cargo+binary
      # metadata. The OLD "archive mode breaks CARGO_BIN_EXE absolute
      # paths" rejection was wrong for a same-path checkout: consumers
      # pass `--extract-to . --workspace-remap .`, which lands every
      # binary back at the exact baked path. Proven 2026-11-25 locally:
      # empty target dir, archive-only, mini_pty PASS in 1.8s, zero
      # compilation. debuginfo stays off via CARGO_PROFILE_DEV_DEBUG=0
      # (panic locations unaffected — #[track_caller] is compiled in);
      # the realchain T9 harness's opencode-rust bin rides the archive
      # as a test-target dependency.
      - name: Build and archive all test binaries (debug)
        run: cargo nextest archive --workspace --locked --archive-file nextest.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: build-target
          path: nextest.tar.zst
          retention-days: 1
          # the archive is already zstd — the zip wrapper must not re-compress
          compression-level: 0

  # CI-03 (2026-11-25): the serialized PTY family was a 25-minute single
  # job — 76% of its pure test time is pty_fuzz (312s) + vt_hover (270s).
  # Shard across three SEPARATE runners (the va9/va10 PTY_LANE_SHARDS
  # rejection was same-host contention; isolated VMs do not share that).
  # Each shard still runs its tests serialized (profile pty).
  pty-integration:
    name: nextest (pty, ${{ matrix.shard }})
    needs: build-archive
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: fuzz
            filter: 'test(pty_fuzz)'
          - shard: hover
            filter: 'test(vt_hover) or test(vt_temporal)'
          - shard: daily
            filter: 'test(mini_pty) or test(pty_boot) or test(pty_tabs) or test(pty_interactions) or test(pty_d3) or binary(pty_daily) or binary(pty_form) or binary(pty_permission) or binary(pty_session_panel)'
    steps:
      - uses: actions/checkout@v4

      # ubuntu-26.04 runners (20261101 image) ship ~21GB of preinstalled
      # toolchains we never use; the multi-GB target artifact plus
      # workspace growth exhausted the runner disk (System.IO.IOException:
      # No space left on device - the nextest jobs died before writing
      # logs). Reclaim the four big preinstalled trees BEFORE unpacking
      # the artifact; runners are ephemeral single-use VMs, so privileged
      # removal is the platform convention.
      - name: Reclaim runner disk (before artifact download)
        run: |
          set -eu
          df -h / | tee "$RUNNER_TEMP/df-before.txt"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghcup /usr/local/.ghcup || true
          df -h / | tee "$RUNNER_TEMP/df-after.txt"

      # CI-06: nextest extracts the archive itself (--extract-to .) —
      # no tar step, no cargo, no freshness walk, no exec-bit hazards.
      - name: Download build artifact (nextest archive)
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: .

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      - uses: taiki-e/install-action@v2
        with:
          # Pin to the dev-gate version (0.9.148): older builds silently
          # ignore profile.default.{env,timeout,overrides[].timeout} —
          # the hard-timeout backstops and bun kill-switch never applied.
          tool: cargo-nextest@0.9.148

      - name: Run PTY integration suites (serialized + retries)
        run: cargo nextest run --archive-file nextest.tar.zst --extract-to . --extract-overwrite --workspace-remap . --profile pty -E '${{ matrix.filter }}'
        env:
          # Job-level: CI nextest ignores profile.default.env (see test job note)
          OPENCODE_DISABLE_BUN_DOWNLOAD: "1"

  test:
    name: nextest
    needs: build-archive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # ubuntu-26.04 runners (20261101 image) ship ~21GB of preinstalled
      # toolchains we never use; the multi-GB target artifact (~10GB
      # unpacked) plus workspace growth exhausted the runner disk
      # (System.IO.IOException: No space left on device - the nextest
      # jobs died before writing logs). Reclaim the four big preinstalled
      # trees BEFORE unpacking the artifact; runners are ephemeral
      # single-use VMs, so privileged removal is the platform convention.
      - name: Reclaim runner disk (before artifact download)
        run: |
          set -eu
          df -h / | tee "$RUNNER_TEMP/df-before.txt"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghcup /usr/local/.ghcup || true
          df -h / | tee "$RUNNER_TEMP/df-after.txt"

      # CI-06: nextest extracts the archive itself (--extract-to .) —
      # no tar step, no cargo, no freshness walk, no exec-bit hazards.
      - name: Download build artifact (nextest archive)
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: .

      # CI-07 (2026-11-25, run 45640264719): the realchain freshness guard
      # (realchain_harness.rs:174) asserts every workspace source is older
      # than the spawned production binary — locally that holds by build
      # order, but the archived binary carries the BUILD job's mtime while
      # this checkout's sources are minutes newer (the old pipeline masked
      # this: consumers recompiled, restamping the binary). Pin exactly the
      # files the guard reads to the epoch: causally true (the archive was
      # built from this very commit in this run) and the guard keeps full
      # force locally. Only this job needs it — the pty/frame consumers
      # spawn the binary without the guard (proven green, same run).
      - name: Age sources below the archived binary (realchain guard)
        run: |
          find crates -type f \( -name '*.rs' -o -name 'Cargo.toml' \) -exec touch -d @0 {} +
          touch -d @0 Cargo.toml Cargo.lock

      # Tests stage scratch sandboxes under /tmp/opencode (PIDs-unique
      # names). The dev box pre-creates it; runners do not.
      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      # oc-plugin-host suites host TS plugins via bun. The download
      # kill-switch (OPENCODE_DISABLE_BUN_DOWNLOAD=1) is enforced below,
      # so provision the pinned bun (oc-util bunman BUN_VERSION) once
      # per job instead — tests that previously self-downloaded 40 MiB
      # (the profile env was silently ignored on runners) now use this.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: taiki-e/install-action@v2
        with:
          # Pin to the dev-gate version (0.9.148): older builds silently
          # ignore profile.default.{env,timeout,overrides[].timeout} —
          # the hard-timeout backstops and bun kill-switch never applied.
          tool: cargo-nextest@0.9.148

      - name: Run test suite
        # --retries 2: absorbs the ledger-tracked CI-timing flakes
        # (GATE-FLAKE-PERM-SAVED m1_scenario_permission_saved,
        # provider_refresh_engine_boot_loop 10s→30s budget class) while
        # those entries stay open for stabilization. Deterministic
        # failures are NOT masked by retries (both tries must pass).
        # OPENCODE_DISABLE_BUN_DOWNLOAD at job level: the CI nextest
        # warns "ignoring unknown configuration key: profile.default.env"
        # (.config/nextest.toml) — the profile env table does not apply
        # on runners, so enforce it here.
        run: cargo nextest run --archive-file nextest.tar.zst --extract-to . --extract-overwrite --workspace-remap . --no-fail-fast --retries 2 -E 'not (test(mini_pty) or test(pty_boot) or test(pty_tabs) or test(pty_interactions) or test(pty_fuzz) or test(vt_hover) or test(vt_temporal) or test(pty_d3) or binary(pty_daily) or binary(pty_form) or binary(pty_permission) or binary(pty_session_panel) or binary(spec_e1_canary))'
        # Channel 9 realchain_t9 rides THIS job (its tests match no pty
        # exclusion pattern; the harness self-serializes via its
        # cross-process lane lock and drives its own PTYs). The ref-side
        # realchain_pair tests also ride here and SKIP (ref checkout +
        # pinned bun absent — ref_lane_skip_reason, W4).
        env:
          OPENCODE_DISABLE_BUN_DOWNLOAD: "1"

      - name: Run the wall-clock timing test solo (spec_e1_canary)
        # 2026-11-28: e1_stall_canary measures the in-process TUI's real
        # flush gaps against a 150 ms threshold. Under the 4-way main step
        # it read CFS contention as "natural stall-bursts" (a whitelisted
        # retry-pass flake); it runs alone instead — the same assertion in
        # a quiet scope. Mirrors the local merge profile's exclusion + the
        # solo timing segment (.config/nextest.toml).
        run: cargo nextest run --archive-file nextest.tar.zst --extract-to . --extract-overwrite --workspace-remap . --profile pty -E 'binary(spec_e1_canary)'
        env:
          OPENCODE_DISABLE_BUN_DOWNLOAD: "1"

      # W12 (user ruling 2026-11-18, GAPS 2.2#11): the realchain tests
      # no longer RED on content — every divergence is exported to
      # .test-logs/diff-reports/ and this controller-side checker is
      # the new gate (exit 2 = unadjudicated divergence OR an
      # expected-shape violation = job red; exit 0 = EXACT reports or
      # full registry coverage). `if: always()` + the directory guard:
      # on a runner where every realchain test skipped (or the suite
      # died before exporting), no reports exist — that is a SKIP with
      # the reason, never an exit-3 false red (the suite's own red
      # already failed the job in the broken-suite case).
      - name: Adjudicate realchain diff reports
        if: always()
        run: |
          if [ ! -d .test-logs/diff-reports ] || ! ls .test-logs/diff-reports/*.json >/dev/null 2>&1; then
            echo "adjudicate: no diff-reports exported (realchain tests skipped or suite failed before export) — skipping"
            exit 0
          fi
          python3 tools/diff/realchain/adjudicate.py .test-logs/diff-reports

  # Frame-budget runs RELEASE (the product profile; debug numbers are
  # informational only). Runs from the release archive — no compilation.
  frame-budget:
    name: frame budget (release)
    needs: build-archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ubuntu-26.04 runners (20261101 image) ship ~21GB of preinstalled
      # toolchains we never use; the multi-GB target artifact (~10GB
      # unpacked) plus workspace growth exhausted the runner disk
      # (System.IO.IOException: No space left on device - the nextest
      # jobs died before writing logs). Reclaim the four big preinstalled
      # trees BEFORE unpacking the artifact; runners are ephemeral
      # single-use VMs, so privileged removal is the platform convention.
      - name: Reclaim runner disk (before artifact download)
        run: |
          set -eu
          df -h / | tee "$RUNNER_TEMP/df-before.txt"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghcup /usr/local/.ghcup || true
          df -h / | tee "$RUNNER_TEMP/df-after.txt"

      # CI-06: nextest extracts the archive itself (--extract-to .) —
      # no tar step, no cargo, no freshness walk, no exec-bit hazards.
      - name: Download build artifact (nextest archive)
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: .

      - uses: taiki-e/install-action@v2
        with:
          # Pin to the dev-gate version (0.9.148): older builds silently
          # ignore profile.default.{env,timeout,overrides[].timeout} —
          # the hard-timeout backstops and bun kill-switch never applied.
          tool: cargo-nextest@0.9.148

      - name: Frame budget guard (debug-calibrated)
        # Release chain removed from CI (20-min cold builds under cache
        # eviction). Debug is ~2-3x slower than the release profile the
        # nominal 40ms budget targets; combined with the ~2x slower
        # shared 2-core runners that is scale 4. Local release runs
        # stay strict. See frame_budget_tests.rs::frame_budget_ms.
        run: cargo nextest run --archive-file nextest.tar.zst --extract-to . --extract-overwrite --workspace-remap . -E 'test(frame_budget)'
        env:
          OC_FRAME_BUDGET_SCALE: "4"
          OPENCODE_DISABLE_BUN_DOWNLOAD: "1"
