name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  guards:
    name: static anti-regression guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # §9.1/§9.3 static guards: stdlib-only python3, no bun/ref/cargo.
      # New violations or expired allowlist entries fail; baselines may
      # only shrink. env_inventory runs from its committed snapshot
      # (no reference checkout on runners).
      - name: Run guards
        run: tools/guards/run.sh

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          # One shared cache entry across jobs: dep artifacts compile
          # once and are reused by every job (per-job default keys made
          # each lane rebuild the chain independently).
          shared-key: opencode-ci

      # sccache: content-addressed compilation cache shared across ALL
      # jobs and runs (merges concurrent writers — the immutable
      # rust-cache entry cannot). Deps compile exactly once, ever; each
      # job then only compiles its own workspace crates.
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  pty-integration:
    name: nextest (pty, serialized)
    runs-on: ubuntu-latest
    # vt-stream lane note: the cell-grid suites (test(vt_hover) /
    # test(vt_temporal)) joined this serialized job — 13 band/Temporal
    # tests ≈ 8 min serialized on top of the existing suites; 40 min
    # covers worst-case retry storms of the older flake-class suites.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          # One shared cache entry across jobs: dep artifacts compile
          # once and are reused by every job (per-job default keys made
          # each lane rebuild the chain independently).
          shared-key: opencode-ci

      # sccache: content-addressed compilation cache shared across ALL
      # jobs and runs (merges concurrent writers — the immutable
      # rust-cache entry cannot). Deps compile exactly once, ever; each
      # job then only compiles its own workspace crates.
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run PTY integration suites (serialized + retries)
        run: cargo nextest run --workspace --locked --profile pty -E 'test(mini_pty) or test(pty_boot) or test(pty_tabs) or test(pty_interactions) or test(pty_fuzz) or test(vt_hover) or test(vt_temporal) or binary(pty_daily) or binary(pty_form) or binary(pty_permission)'
        env:
          # Job-level: CI nextest ignores profile.default.env (see test job note)
          OPENCODE_DISABLE_BUN_DOWNLOAD: "1"

  test:
    name: nextest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          # One shared cache entry across jobs: dep artifacts compile
          # once and are reused by every job (per-job default keys made
          # each lane rebuild the chain independently).
          shared-key: opencode-ci

      # sccache: content-addressed compilation cache shared across ALL
      # jobs and runs (merges concurrent writers — the immutable
      # rust-cache entry cannot). Deps compile exactly once, ever; each
      # job then only compiles its own workspace crates.
      - uses: mozilla-actions/sccache-action@v0.0.9

      # Tests stage scratch sandboxes under /tmp/opencode (PIDs-unique
      # names). The dev box pre-creates it; runners do not.
      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run test suite
        # --retries 2: absorbs the ledger-tracked CI-timing flakes
        # (GATE-FLAKE-PERM-SAVED m1_scenario_permission_saved,
        # provider_refresh_engine_boot_loop 10s→30s budget class) while
        # those entries stay open for stabilization. Deterministic
        # failures are NOT masked by retries (both tries must pass).
        # OPENCODE_DISABLE_BUN_DOWNLOAD duplicated at job level: the CI
        # nextest build warns "ignoring unknown configuration key:
        # profile.default.env" (.config/nextest.toml) — the profile env
        # table does not apply there, so enforce it here.
        run: cargo nextest run --workspace --locked --no-fail-fast --retries 2 -E 'not (test(mini_pty) or test(pty_boot) or test(pty_tabs) or test(pty_interactions) or test(pty_fuzz) or test(vt_hover) or test(vt_temporal) or binary(pty_daily) or binary(pty_form) or binary(pty_permission))'
        env:
          OPENCODE_DISABLE_BUN_DOWNLOAD: "1"

  # Frame-budget runs RELEASE (the product profile; debug numbers are
  # informational only). Split into its own job: the release codegen of
  # the full dep chain (incl. miniaudio-sys/tree-sitter C) is 10-20 min
  # cold on 2-core runners and used to extend the test job's critical
  # path serially; parallel here with its own rust-cache (release
  # artifacts persist per-job → incremental after the first run).
  frame-budget:
    name: frame budget (release)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          # One shared cache entry across jobs: dep artifacts compile
          # once and are reused by every job (per-job default keys made
          # each lane rebuild the chain independently).
          shared-key: opencode-ci

      # sccache: content-addressed compilation cache shared across ALL
      # jobs and runs (merges concurrent writers — the immutable
      # rust-cache entry cannot). Deps compile exactly once, ever; each
      # job then only compiles its own workspace crates.
      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Frame budget guard (release)
        # CI runners are ~2x slower than the dev box the nominal 40ms
        # budget is calibrated for (shared 2-core). The scale widens the
        # regression ceiling for slow machines only; local runs stay
        # strict. See frame_budget_tests.rs::frame_budget_ms.
        run: cargo nextest run --release -p oc-tui --locked -E 'test(frame_budget)'
        env:
          OC_FRAME_BUDGET_SCALE: "2"
          OPENCODE_DISABLE_BUN_DOWNLOAD: "1"
