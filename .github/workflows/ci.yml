name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  guards:
    name: static anti-regression guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # §9.1/§9.3 static guards: stdlib-only python3, no bun/ref/cargo.
      # New violations or expired allowlist entries fail; baselines may
      # only shrink. env_inventory runs from its committed snapshot
      # (no reference checkout on runners).
      - name: Run guards
        run: tools/guards/run.sh

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  pty-integration:
    name: nextest (pty, serialized)
    runs-on: ubuntu-latest
    # vt-stream lane note: the cell-grid suites (test(vt_hover) /
    # test(vt_temporal)) joined this serialized job — 13 band/Temporal
    # tests ≈ 8 min serialized on top of the existing suites; 40 min
    # covers worst-case retry storms of the older flake-class suites.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run PTY integration suites (serialized + retries)
        run: cargo nextest run --workspace --locked --profile pty -E 'test(mini_pty) or test(pty_boot) or test(pty_tabs) or test(pty_interactions) or test(pty_fuzz) or test(vt_hover) or test(vt_temporal) or binary(pty_daily) or binary(pty_form) or binary(pty_permission) or binary(pty_session_route) or binary(pty_lane_if)'

  test:
    name: nextest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # Tests stage scratch sandboxes under /tmp/opencode (PIDs-unique
      # names). The dev box pre-creates it; runners do not.
      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run test suite
        run: cargo nextest run --workspace --locked --no-fail-fast -E 'not (test(mini_pty) or test(pty_boot) or test(pty_tabs) or test(pty_interactions) or test(pty_fuzz) or test(vt_hover) or test(vt_temporal) or binary(pty_daily) or binary(pty_form) or binary(pty_permission) or binary(pty_session_route) or binary(pty_lane_if))' 

      # Frame-budget guard runs in RELEASE (the product profile);
      # debug numbers are informational only (see the test's notes).
      - name: Frame budget guard (release)
        # CI runners are ~2x slower than the dev box the nominal 40ms
        # budget is calibrated for (shared 2-core). The scale widens the
        # regression ceiling for slow machines only; local runs stay
        # strict. See frame_budget_tests.rs::frame_budget_ms.
        run: cargo nextest run --release -p oc-tui --locked -E 'test(frame_budget)'
        env:
          OC_FRAME_BUDGET_SCALE: "2"
