# runtime-gates — CI-RUNTIME lane (user ruling 2026-10-20: 使用 GitHub CI)
#
# Everything runtime-shaped that cannot live in the fast ci.yml loop:
# the p10 battery (§12.2), the §12.3 runtime gates, the 9 needs-runtime
# ledger entries, a non-linux-x64 build target (§12.4 SURF-PLATFORM CI
# leg), the release smoke (§12.4), and an opt-in 30m soak.
#
# Job graph (one compilation, mirrors ci.yml's build-archive pattern):
#
#   build-archive ──> v2-db-fixture ──┬──> p10-battery        (§12.2 exit battery)
#                                     └──> runtime-gates      (§12.3 set)
#   build-archive ──> ai-needs-runtime  (AI-VERTEX-V2 / AI-V1 / AI-COPILOT-C6, cassette + opt-in live canary)
#   build-archive ──> tui-needs-runtime (6 TUI rows: gap probes + adjacent PTY battery)
#   build-archive ──> soak-30m           (opt-in, default OFF)
#   build-archive ──> release-smoke      (opt-in, default OFF)
#   platform-build                       (macos-latest, compiles from source)
#   gates-summary                        (EXECUTED vs SKIPPED ledger; skip ≠ pass)
#
# SECRETS (documented per lane spec; the ledger repros are manual and read
# no env of their own, so these CI-side names are the contract):
#   OC_CI_VERTEX_PROJECT + OC_CI_VERTEX_CREDENTIALS -> AI-VERTEX-V2 live leg
#   OC_CI_GEMINI_API_KEY                           -> AI-V1 live leg
#   OC_CI_COPILOT_TOKEN                            -> AI-COPILOT-C6 live leg
#
# LIVE CONTRACT (user ruling 2026-10-21: live canary, OPT-IN via the
# workflow_dispatch input `live`, default false — the default run keeps
# ADR-0006 cassette-only). The probes live in
# tools/parity/tests/live_ai_probes.rs and reuse the production oc-ai
# call surface. Secret shapes:
#   OC_CI_VERTEX_PROJECT      GCP project id (drives URL composition).
#   OC_CI_VERTEX_CREDENTIALS  RECOMMENDED: a service-account key-file
#                             JSON (the downloaded *.json — static, no
#                             refresh before dispatch). The probes stage
#                             it as a 0600 temp ADC file for the duration
#                             of the token grant only and mint the access
#                             token through the PRODUCTION CRED-V3 chain
#                             (RS256 self-signed JWT grant at the key's
#                             token_uri) — itself a live check of CRED-V3.
#                             COMPAT: a raw OAuth2 access token
#                             (ya29.…, ~1h lifetime) still passes through.
#                             An API key is NOT accepted in either shape:
#                             the messages and chat/responses lanes are
#                             ADC-bearer only (and reject keys loudly).
#                             Also drives AI-V1's chat/responses live legs.
#   OC_CI_GEMINI_API_KEY      Gemini API key — drives AI-V1's Express-mode
#                             (x-goog-api-key) live leg.
#   OC_CI_COPILOT_TOKEN       GitHub Copilot token (ghu_…) with /models
#                             visibility — the AI-COPILOT-C6 /models sync.
# live=true requires ALL FOUR (an explicit live run without them is a
# configuration error: this workflow fails loudly instead of going green).
# live=false (default): cassette battery + LIVE-SKIP (secrets missing) /
# LIVE-AVAILABLE (secrets present, not requested) warnings — neither is a
# live pass. Probe budgets: ≤60s per probe; evidence (endpoint/time/status/
# shape, never credential values) lands in the run log and
# /tmp/opencode/parity-evidence/CI-RUNTIME-AI-LIVE/live-runs.jsonl.
#
# NOTE (422 fix, 2026-10-21): the `secrets` context is ILLEGAL in `if:`
# conditions at any level — it is only read in the ai-needs-runtime job's
# env VALUES (presence booleans HAS_*) and in the live-battery step's env
# VALUES (the actual secrets), never in an expression position that
# GitHub's parser rejects.
#
# KNOWN-REDS: while tools/parity/goldens/p10/known-red.json keeps
# GATE-DB-STABLE / GATE-DB-NULLROWS / GATE-TUI-RENAME open, the p10
# battery is expected RED. A red battery is the honest signal (open ledger
# ids); there is deliberately NO skip logic in this workflow.
#
# GAPS this workflow reports but cannot close (no test exists — writing
# them is product-lane work, not CI plumbing):
#   - the 6 TUI needs-runtime rows (TUI-28/30/33/TD06/TD15/TD28): ledger
#     `test` names match 0 tests (probed loudly in tui-needs-runtime);
#   - the 3 AI ledger test names (never_api_anthropic,
#     copilot_provideroption_user_agent, vertex_chat_responses_url): 0 matches;
#   - subagent-completion-wakes-parent: COVERED —
#     oc-core::runtime_recovery::background_completion_wakes_idle_parent;
#   - 30m soak: approximated by a wall-clock-bounded cycle loop over the
#     kill-9-recovery + reconnect-resync suites (no single-session 30m TUI
#     harness exists).
#
# TODO(user): enable the nightly schedule ONLY when you accept the
# runner-minutes cost (the battery boots both sides; macos builds are
# 10x-minute rated). Until then this workflow is dispatch-only:
#
# schedule:
#   - cron: "0 3 * * *"

name: runtime-gates

on:
  workflow_dispatch:
    inputs:
      run_p10_battery:
        description: "p10 battery (§12.2 exit gate, verbatim command)"
        type: boolean
        default: true
      run_runtime_gates:
        description: "§12.3 runtime gates (omo-slim, kill-9, resync, v2 import)"
        type: boolean
        default: true
      run_needs_runtime:
        description: "needs-runtime battery (3 AI cassette + 6 TUI gap probes)"
        type: boolean
        default: true
      live:
        description: "AI live canary (tools/parity/tests/live_ai_probes.rs; requires ALL FOUR OC_CI_* secrets — see the workflow header contract)"
        type: boolean
        default: false
      run_platform_build:
        description: "non-linux-x64 build target (macos-latest)"
        type: boolean
        default: true
      run_soak_30m:
        description: "30-minute soak (expensive; opt-in)"
        type: boolean
        default: false
      run_release_smoke:
        description: "release build + tools/release-smoke.sh (expensive; opt-in)"
        type: boolean
        default: false

# Long jobs (battery boots both sides; soak runs 30m by design): never
# cancel a run mid-flight on the same ref.
concurrency:
  group: runtime-gates-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The pinned v2.0.24 reference source (docs/parity-baseline.md:
  # /opt/opencode-ref @ e7a34f09bf). Runners fetch this tarball the same
  # way release.yml fetches APP_REF for the web UI.
  PARITY_REF: e7a34f09bfd9134dfade5a8ddb843f7030bc9a69
  # Job-level bun kill-switch (ci.yml convention: the CI nextest ignores
  # profile.default.env, so enforce it here; bun is provisioned per-job by
  # oven-sh/setup-bun instead of per-test downloads).
  OPENCODE_DISABLE_BUN_DOWNLOAD: "1"

jobs:
  # ONE compilation for the whole workflow (ci.yml build-archive pattern):
  # all test binaries built once, shipped as the target dir, consumed with
  # zero recompile by every linux test job below.
  build-archive:
    name: build + archive (single compile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          # Same shared entry as ci.yml: dep artifacts compile once and are
          # reused across workflows/jobs.
          shared-key: opencode-ci

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: taiki-e/install-action@v2
        with:
          # Pin to the dev-gate version (0.9.148): older builds silently
          # ignore profile.default.{env,timeout,overrides[].timeout}.
          tool: cargo-nextest@0.9.148

      - name: Prepare scratch dir
        # /tmp/opencode (not $RUNNER_TEMP) on purpose: the tests stage
        # sandboxes under this literal path and the runners are ephemeral.
        run: mkdir -p /tmp/opencode

      # Same-path target dir (NOT a nextest archive): tests bake
      # env!("CARGO_BIN_EXE_*") absolute paths; see ci.yml's note.
      - name: Build workspace test binaries (debug)
        run: cargo nextest run --workspace --locked --no-run
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"

      - name: Prune non-relocatable artifacts
        run: rm -rf target/debug/incremental target/release/incremental

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-gates-target
          path: target/
          retention-days: 1
          include-hidden-files: false

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### build-archive"
            echo "- EXECUTED: workspace nextest --no-run (single compile); artifact \`runtime-gates-target\` uploaded"
          } >> "$GITHUB_STEP_SUMMARY"

  # Generate a REAL v2-written library db on the runner: the interop lane
  # boots the pinned v2.0.24 reference and writes sessions A/B/C + a
  # prompt exchange through the real v2 engine. The resulting opencode.db
  # feeds both p10-battery (PARITY_V2_DB_FIXTURE — db_import FAILS under
  # OC_GATE_STRICT without it) and runtime-gates (OC_REAL_DB — the
  # null-census import gate).
  #
  # KNOWN-RED-TOLERANT staging: p10_db_interop_v2_written_null_rows is a
  # registered OPEN known-red (ledger GATE-DB-NULLROWS; known-red.json; its
  # own wrapper tools/parity/tests/p10_db_interop.rs:128-133 keeps the
  # failure a failure) and fails ~15s in — AFTER the reference has written
  # the db. The staging step therefore runs with continue-on-error and the
  # db is harvested from the write path the test actually uses. If no db
  # appears (real breakage, not the known-red), the job emits ::error,
  # sets db_staged=gap, and gates-summary reports SKIPPED-GAP — never a
  # pass.
  v2-db-fixture:
    name: stage v2-written library db
    needs: build-archive
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      db_staged: ${{ steps.locate.outputs.db_staged }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: runtime-gates-target
          path: target

      # upload-artifact@v4 does NOT preserve the executable bit: the
      # downloaded target/ carries every workspace bin as a 0644 file
      # and any spawn fails with EACCES (CI run 39468671027 legs 2+3:
      # "spawn .../target/debug/oc-server: Permission denied (os error
      # 13)"). Enumerate the bin names from the workspace manifests via
      # cargo metadata (no guessing) and restore ONLY target/debug/<bin>
      # — never a blanket chmod -R over the target dir.
      - name: Restore the exec bit on artifact-shipped binaries
        run: |
          set -euo pipefail
          BINS="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name')"
          if [ -z "$BINS" ]; then
            echo "::error::cargo metadata enumerated zero workspace bins — refusing to no-op the exec-bit restore"
            exit 1
          fi
          for bin in $BINS; do
            if [ -f "target/debug/$bin" ]; then
              chmod +x "target/debug/$bin"
              echo "exec bit restored: target/debug/$bin"
            fi
          done

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      - name: Fetch the pinned v2.0.24 reference source
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
            -o ref.tar.gz "https://github.com/anomalyco/opencode/archive/${PARITY_REF}.tar.gz"
          mkdir -p /tmp/opencode/ref
          tar -xzf ref.tar.gz -C /tmp/opencode/ref --strip-components=1
          test -d /tmp/opencode/ref/packages/cli

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: parity-ref-bun-${{ env.PARITY_REF }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # The parity harness launches bun by ABSOLUTE path ($PARITY_BUN ->
      # Command::new(bun), tools/parity/src/reference.rs), and the v2
      # reference re-spawns itself via process.execPath (also absolute) —
      # nothing resolves bun by name on the harness child PATH. So instead
      # of a well-known-path symlink, export the resolved setup-bun binary
      # for the later steps in this job: PARITY_BUN via $GITHUB_ENV, its
      # dir via $GITHUB_PATH.
      - name: Expose bun to the harness (PARITY_BUN + PATH)
        run: |
          set -euo pipefail
          BUN="$(command -v bun)"
          test -n "$BUN"
          echo "$(dirname "$BUN")" >> "$GITHUB_PATH"
          echo "PARITY_BUN=$BUN" >> "$GITHUB_ENV"
          "$BUN" --version

      - name: Install reference deps
        run: bun install --frozen-lockfile
        working-directory: /tmp/opencode/ref

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148

      # Non-strict on purpose: this is prerequisite STAGING (the strict,
      # verbatim battery runs in p10-battery). OC_P10=1 opts the ignored
      # test in; the reference side boots from /tmp/opencode/ref (REF_ROOT
      # default), the Rust side reuses the archive's target dir.
      # continue-on-error: the known-red GATE-DB-NULLROWS fires AFTER the
      # reference wrote the db — the failure is expected and tolerated
      # HERE ONLY (p10-battery still reports it red, as it should).
      - name: Run the interop lane (v2 writes REAL rows; known-red tolerated)
        continue-on-error: true
        run: cargo nextest run -p parity --locked --run-ignored only -E 'test(p10_db_interop_v2_written_null_rows)'
        env:
          OC_P10: "1"
          PARITY_REF_SOURCE: /tmp/opencode/ref
          # PARITY_BUN arrives via GITHUB_ENV (Expose bun step above).

      # Write path verified from tools/parity/tests/p10_db_interop.rs:
      #   :144  let root = PathBuf::from(format!("/tmp/opencode/p10-db-{}", std::process::id()));
      #   :145  let home = root.join("home");
      #   :167  let db = home.join(".local/share/opencode/opencode.db");
      # => /tmp/opencode/p10-db-<pid>/home/.local/share/opencode/opencode.db
      # (NOT the parity-sandbox root). Newest first; single run => one dir.
      #
      # GATE-DB-FIXTURE-WAL: the reference runs the library db in WAL mode
      # (packages/core/src/database/sqlite.bun.ts:93 `PRAGMA journal_mode
      # = WAL`). When the interop lane is red the harness ends the
      # reference before SQLite ever checkpoints, so the schema+data stay
      # committed in the `-wal` sidecar while the main file is a single
      # 4096-byte header page — the bare `cp "$DB" v2-library.db` shipped
      # exactly that shell in run 39519736380 (0 tables in
      # sqlite_master; downstream: `no such table: migration`). Harvest
      # the COMPLETE set instead: copy the sidecars next to the staged
      # main file, checkpoint the STAGED copy (never the live original),
      # and VALIDATE before uploading — a shell must fail loudly here
      # rather than ride the artifact into the downstream gates.
      - name: Locate + harvest the v2-written library db (WAL sidecars + checkpoint + validate)
        id: locate
        run: |
          set -euo pipefail
          DB="$(find /tmp/opencode/p10-db-*/home/.local/share/opencode/opencode.db -type f -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$DB" ] || [ ! -s "$DB" ]; then
            echo "::error::no v2-written opencode.db under /tmp/opencode/p10-db-*/ — the interop lane failed before writing (real breakage, not the known-red). Fixture is GAP; downstream import gates will report it, never pass silently."
            echo "db_staged=gap" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$DB" v2-library.db
          for side in -wal -shm; do
            if [ -f "$DB$side" ]; then
              cp "$DB$side" "v2-library.db$side"
            fi
          done
          ls -l v2-library.db*
          # Fold the staged -wal into the staged main file so the artifact
          # is self-contained even for consumers that copy the main file
          # alone. python3 ships on ubuntu-latest; the staged copy's
          # writer is dead, so nothing contends the lock.
          python3 -c "import sqlite3; c = sqlite3.connect('v2-library.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()" \
            || { echo "::error::wal_checkpoint(TRUNCATE) failed on the staged copy — refusing to upload an uncheckpointed fixture"; exit 1; }
          # VALIDATE before uploading (GATE-DB-FIXTURE-WAL): two probes —
          # (a) the staged set with sidecars, (b) the main file ALONE in a
          # clean dir (the exact shape run 39519736380 shipped broken).
          # A 0-table / rowless shell fails loudly here; it never rides
          # the artifact into the downstream import gates.
          mkdir -p fixture-validate-alone
          cp v2-library.db fixture-validate-alone/v2-library.db
          python3 - <<'PY'
          import sqlite3, sys

          def probe(label, path):
              conn = sqlite3.connect(path)
              try:
                  tables = [r[0] for r in conn.execute(
                      "SELECT name FROM sqlite_master WHERE type = 'table'")]
                  if "migration" not in tables:
                      print(f"::error::{label}: migration table missing (tables: {tables}) — the harvested db is a WAL shell, not the library the reference wrote")
                      sys.exit(1)
                  migrations = conn.execute("SELECT count(*) FROM migration").fetchone()[0]
                  if migrations < 1:
                      print(f"::error::{label}: migration table exists but holds {migrations} rows")
                      sys.exit(1)
                  sessions = conn.execute("SELECT count(*) FROM session_v2").fetchone()[0]
                  if sessions < 1:
                      print(f"::error::{label}: session_v2 holds {sessions} rows — not a usable v2 library fixture")
                      sys.exit(1)
                  print(f"fixture OK ({label}): {migrations} migration rows, {sessions} session_v2 rows, {len(tables)} tables")
              finally:
                  conn.close()

          probe("sidecar set", "v2-library.db")
          probe("main file alone", "fixture-validate-alone/v2-library.db")
          PY
          echo "db_staged=ok" >> "$GITHUB_OUTPUT"

      - name: Upload the v2-written library db
        if: steps.locate.outputs.db_staged == 'ok'
        uses: actions/upload-artifact@v4
        with:
          # Main file + whatever sidecars survived the staged checkpoint
          # (wal_checkpoint(TRUNCATE) + clean close usually removes them;
          # if any remain they ride along so the sidecar route also
          # works — the consumers copy them only when present).
          name: v2-db-fixture
          path: v2-library.db*
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### v2-db-fixture"
            if [ "${{ steps.locate.outputs.db_staged }}" = "ok" ]; then
              echo "- EXECUTED: interop lane ran (known-red GATE-DB-NULLROWS tolerated here; p10-battery reports it red) — v2.0.24 wrote real session rows; harvested WITH -wal/-shm sidecars + staged wal_checkpoint(TRUNCATE), validated (migration + session_v2 rows, main-file-alone probe) BEFORE upload; artifact \`v2-db-fixture\` uploaded"
            else
              echo "- SKIPPED-GAP: no v2-written db was produced — PARITY_V2_DB_FIXTURE/OC_REAL_DB stay unset downstream (db_import fails strict; census self-skips and is GAP-marked). Skip ≠ pass."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # §12.2 exit gate: the p10 battery, VERBATIM command. Expected RED while
  # known-red.json keeps GATE-DB-STABLE / GATE-DB-NULLROWS /
  # GATE-TUI-RENAME open — that is the honest signal, no skip logic.
  p10-battery:
    name: p10 battery (§12.2 exit gate)
    needs: [build-archive, v2-db-fixture]
    if: ${{ inputs.run_p10_battery != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: runtime-gates-target
          path: target

      # upload-artifact@v4 does NOT preserve the executable bit: the
      # downloaded target/ carries every workspace bin as a 0644 file
      # and any spawn fails with EACCES (CI run 39468671027 legs 2+3:
      # "spawn .../target/debug/oc-server: Permission denied (os error
      # 13)"). Enumerate the bin names from the workspace manifests via
      # cargo metadata (no guessing) and restore ONLY target/debug/<bin>
      # — never a blanket chmod -R over the target dir.
      - name: Restore the exec bit on artifact-shipped binaries
        run: |
          set -euo pipefail
          BINS="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name')"
          if [ -z "$BINS" ]; then
            echo "::error::cargo metadata enumerated zero workspace bins — refusing to no-op the exec-bit restore"
            exit 1
          fi
          for bin in $BINS; do
            if [ -f "target/debug/$bin" ]; then
              chmod +x "target/debug/$bin"
              echo "exec bit restored: target/debug/$bin"
            fi
          done

      - name: Download the v2 library db (fixture)
        if: needs.v2-db-fixture.outputs.db_staged == 'ok'
        uses: actions/download-artifact@v4
        with:
          name: v2-db-fixture

      # PARITY_V2_DB_FIXTURE is wired here (not in the battery step's env)
      # so the gap case can leave it unset: under OC_GATE_STRICT the
      # db_import test then FAILS with its own "missing prerequisite"
      # message — the honest strict signal, never a silent pass.
      - name: Wire the v2 library db (or mark the GAP)
        run: |
          set -euo pipefail
          if [ "${{ needs.v2-db-fixture.outputs.db_staged }}" = "ok" ] && [ -s v2-library.db ]; then
            echo "PARITY_V2_DB_FIXTURE=$PWD/v2-library.db" >> "$GITHUB_ENV"
          else
            echo "::warning::GAP (v2 db fixture missing): PARITY_V2_DB_FIXTURE stays unset — p10_db_import_real_library_copy will FAIL under OC_GATE_STRICT (honest strict signal, not a pass)."
          fi

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      # The p10 TUI lanes spawn tmux BY NAME from the test process
      # (tools/parity/src/termatrix.rs: Command::new("tmux")), which
      # inherits this step's PATH. ubuntu-latest images ship tmux
      # preinstalled; the fallback below extracts the .deb set into $HOME
      # and puts it on PATH (user-level only — the sanctioned privilege
      # path is tools/dev-gate.sh, nothing here may use it).
      - name: Ensure tmux (p10 TUI lanes)
        run: |
          set -euo pipefail
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
            exit 0
          fi
          echo "::warning::tmux not preinstalled on this image — falling back to a user-level .deb extraction"
          ROOT="$HOME/.local/opt/tmux"
          mkdir -p "$ROOT"
          cd "${RUNNER_TEMP:-/tmp}" || exit 1
          # shellcheck disable=SC2013
          for p in $(apt-cache depends --recurse --no-recommends --no-suggests \
                       --no-conflicts --no-breaks --no-replaces --no-enhances tmux \
                       | grep -E '^[a-zA-Z0-9]' \
                       | grep -vE '^(libc6|libgcc-s1|gcc-[0-9.]+-base|libtinfo6)$' | sort -u); do
            apt-get download "$p" || echo "::warning::could not fetch $p (virtual or absent) — relying on the image copy"
          done
          for d in ./*.deb; do dpkg -x "$d" "$ROOT"; done
          echo "$ROOT/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$ROOT/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          export PATH="$ROOT/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$ROOT/usr/lib/x86_64-linux-gnu"
          tmux -V

      - name: Fetch the pinned v2.0.24 reference source
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
            -o ref.tar.gz "https://github.com/anomalyco/opencode/archive/${PARITY_REF}.tar.gz"
          mkdir -p /tmp/opencode/ref
          tar -xzf ref.tar.gz -C /tmp/opencode/ref --strip-components=1
          test -d /tmp/opencode/ref/packages/cli

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: parity-ref-bun-${{ env.PARITY_REF }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Expose bun to the harness (PARITY_BUN + PATH)
        run: |
          set -euo pipefail
          BUN="$(command -v bun)"
          test -n "$BUN"
          echo "$(dirname "$BUN")" >> "$GITHUB_PATH"
          echo "PARITY_BUN=$BUN" >> "$GITHUB_ENV"
          "$BUN" --version

      - name: Install reference deps
        run: bun install --frozen-lockfile
        working-directory: /tmp/opencode/ref

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148

      # The exit-gate command, VERBATIM (env via the step block):
      #   OC_P10=1 OC_GATE_STRICT=1 cargo nextest run -p parity --locked \
      #     --run-ignored only -E 'test(p10_)'
      # 11 tests (verified via `cargo nextest list --run-ignored only`):
      # p10_cli_gate5, p10_cross_client, p10_cross_tui, p10_db_import,
      # p10_db_interop x2, p10_error_paths, p10_http_contract_gate1,
      # p10_openapi, p10_tools_gate3, p10_tui_frames_gate4.
      - name: p10 battery (verbatim exit-gate command)
        run: cargo nextest run -p parity --locked --run-ignored only -E 'test(p10_)'
        env:
          OC_P10: "1"
          OC_GATE_STRICT: "1"
          # PARITY_V2_DB_FIXTURE arrives via GITHUB_ENV (Wire step above):
          # set when the fixture landed, deliberately unset on GAP.
          PARITY_REF_SOURCE: /tmp/opencode/ref
          # PARITY_BUN arrives via GITHUB_ENV (Expose bun step above).

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### p10-battery"
            echo "- EXECUTED: verbatim exit-gate command (OC_P10=1 OC_GATE_STRICT=1, 11 tests incl. gates 1/3/4/5 + cross lanes + db interop/import)"
            echo "- known-reds live in tools/parity/goldens/p10/known-red.json (GATE-DB-STABLE, GATE-DB-NULLROWS, GATE-TUI-RENAME): red here = open ledger ids, NOT a workflow bug"
          } >> "$GITHUB_STEP_SUMMARY"

  # §12.3 runtime set, as selections over EXISTING tests (17 non-PTY +
  # 11 serialized-PTY, verified via nextest list):
  #   real plugin (omo-slim)      -> pty_sidebar_real_omos_sections_render
  #                                   (stages the REAL npm install via
  #                                   OC_OMOS_ROOT/OC_OMOS_DEPS) + slot_click
  #                                   (omo-slim-modeled fixture) +
  #                                   vt_plugin_sidebar (scan-lane fixed path)
  #   kill -9 / crash recovery    -> binary(runtime_recovery) (6 tests)
  #   subagent wakes parent       -> background_completion_wakes_idle_parent
  #   reconnect forms/permissions -> binary(reconnect_resync) (9 tests) +
  #                                   pty_form + pty_permission (serialized)
  #   real v2 library import      -> real_db_null_census w/ OC_REAL_DB (the
  #                                   v2-written db from v2-db-fixture;
  #                                   GAP-skips without it)
  runtime-gates:
    name: §12.3 runtime gates
    needs: [build-archive, v2-db-fixture]
    if: ${{ inputs.run_runtime_gates != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: runtime-gates-target
          path: target

      # upload-artifact@v4 does NOT preserve the executable bit: the
      # downloaded target/ carries every workspace bin as a 0644 file
      # and any spawn fails with EACCES (CI run 39468671027 legs 2+3:
      # "spawn .../target/debug/oc-server: Permission denied (os error
      # 13)"). Enumerate the bin names from the workspace manifests via
      # cargo metadata (no guessing) and restore ONLY target/debug/<bin>
      # — never a blanket chmod -R over the target dir.
      - name: Restore the exec bit on artifact-shipped binaries
        run: |
          set -euo pipefail
          BINS="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name')"
          if [ -z "$BINS" ]; then
            echo "::error::cargo metadata enumerated zero workspace bins — refusing to no-op the exec-bit restore"
            exit 1
          fi
          for bin in $BINS; do
            if [ -f "target/debug/$bin" ]; then
              chmod +x "target/debug/$bin"
              echo "exec bit restored: target/debug/$bin"
            fi
          done

      - name: Download the v2 library db (fixture)
        if: needs.v2-db-fixture.outputs.db_staged == 'ok'
        uses: actions/download-artifact@v4
        with:
          name: v2-db-fixture

      # OC_REAL_DB wired via GITHUB_ENV so the GAP case leaves it unset:
      # real_db_null_census then self-skips (prints its skip line) and the
      # summary below marks the v2-import §12.3 row GAP — never a pass.
      - name: Wire the v2 library db (or mark the GAP)
        run: |
          set -euo pipefail
          if [ "${{ needs.v2-db-fixture.outputs.db_staged }}" = "ok" ] && [ -s v2-library.db ]; then
            echo "OC_REAL_DB=$PWD/v2-library.db" >> "$GITHUB_ENV"
          else
            echo "::warning::GAP (v2 db fixture missing): OC_REAL_DB stays unset — real_db_null_census will self-skip; the §12.3 real-v2-import row is GAP-marked in this job's summary (skip ≠ pass)."
          fi

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148

      # 17 tests (verified via nextest list): runtime_recovery x6
      # (incl. background_completion_wakes_idle_parent), reconnect_resync
      # x9, real_db_null_census x1 (needs OC_REAL_DB — GAP-skips without
      # it), slot_click x1.
      - name: §12.3 non-PTY set (recovery, resync, v2 import, plugin click pipe)
        run: cargo nextest run --workspace --locked -E 'binary(runtime_recovery) or binary(reconnect_resync) or binary(real_db_null_census) or test(slot_click_runs_the_plugin_row_handler_and_navigates)'

      # Stage the REAL oh-my-opencode-slim npm install. One staging dir
      # feeds both seams: pty_sidebar reads OC_OMOS_ROOT/OC_OMOS_DEPS;
      # vt_plugin_sidebar reads the scan-lane fixed path
      # /tmp/opencode/scanab/omos-npm/stamp-full/... (no env seam exists —
      # staging at that literal path is the only way it runs on CI).
      - name: Stage the real oh-my-opencode-slim (omo-slim flagship)
        run: |
          set -euo pipefail
          ROOT=/tmp/opencode/scanab/omos-npm/stamp-full
          mkdir -p "$ROOT"
          cd "$ROOT"
          echo '{"name":"omos-stage","private":true}' > package.json
          bun add oh-my-opencode-slim@latest
          test -d node_modules/oh-my-opencode-slim/dist/server
          test -f node_modules/oh-my-opencode-slim/package.json
          echo "staged real omo-slim install at $ROOT"

      # PTY-family binaries serialized in ONE invocation (ci.yml pattern:
      # --profile pty, test-threads=1; spawn-contention class).
      # 11 tests (verified via nextest list): pty_sidebar x4 (incl.
      # pty_sidebar_real_omos_sections_render), pty_form x2,
      # pty_permission x4, vt_plugin_sidebar x1.
      - name: §12.3 PTY set (serialized; real omo-slim sidebar, forms, permissions)
        run: cargo nextest run --workspace --locked --profile pty -E 'binary(pty_sidebar) or binary(pty_form) or binary(pty_permission) or binary(vt_plugin_sidebar)'
        env:
          OC_OMOS_ROOT: /tmp/opencode/scanab/omos-npm/stamp-full/node_modules/oh-my-opencode-slim
          OC_OMOS_DEPS: /tmp/opencode/scanab/omos-npm/stamp-full/node_modules

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### runtime-gates (§12.3)"
            echo "| §12.3 item | gate |"
            echo "|---|---|"
            echo "| 真实插件 omo-slim | pty_sidebar_real_omos_sections_render (REAL npm install) + slot_click + vt_plugin_sidebar |"
            if [ -n "${OC_REAL_DB:-}" ]; then
              echo "| 真实 v2 库导入 | real_db_null_census (OC_REAL_DB = v2-written db) |"
            else
              echo "| 真实 v2 库导入 | SKIPPED-GAP: no v2 db fixture — real_db_null_census self-skipped (skip ≠ pass) |"
            fi
            echo "| kill -9 恢复 | runtime_recovery (6 tests) |"
            echo "| 表单/权限重连不丢 | reconnect_resync (9) + pty_form + pty_permission |"
            echo "| subagent 唤醒父会话 | background_completion_wakes_idle_parent |"
            echo "| 30 分钟长会话 | NOT here — see soak-30m (opt-in) |"
            echo ""
            echo "Counts: non-PTY set 17 tests; serialized PTY set 11 tests."
          } >> "$GITHUB_STEP_SUMMARY"

  # The 3 AI needs-runtime rows: cassette battery ALWAYS, plus the OPT-IN
  # live canary (user ruling 2026-10-21; ADR-0006 addendum). The cassette
  # leg keeps the hermetic URL/auth/wire coverage; the live leg
  # (tools/parity/tests/live_ai_probes.rs, OC_CI_LIVE=1) drives the
  # production call surface against real endpoints and can go RED — that
  # red propagates to this job and gates-summary (skip ≠ pass, red ≠ pass).
  ai-needs-runtime:
    name: "needs-runtime (AI: vertex/gemini/copilot, cassette + opt-in live)"
    needs: build-archive
    if: ${{ inputs.run_needs_runtime != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # secrets are ILLEGAL inside if: conditions at any level (workflow
    # parse fails with "Unrecognized named-value: 'secrets'" — the
    # 2026-10-21 HTTP 422). The documented workaround: materialize secret
    # PRESENCE as env booleans here (secrets ARE legal in env values) and
    # gate the live-leg steps on env.<HAS_*> below. Only "true"/"false"
    # strings are ever materialized — never the secret values themselves.
    env:
      HAS_VERTEX_CREDS: ${{ secrets.OC_CI_VERTEX_PROJECT != '' && secrets.OC_CI_VERTEX_CREDENTIALS != '' }}
      HAS_GEMINI_KEY: ${{ secrets.OC_CI_GEMINI_API_KEY != '' }}
      HAS_COPILOT_TOKEN: ${{ secrets.OC_CI_COPILOT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: runtime-gates-target
          path: target

      # upload-artifact@v4 does NOT preserve the executable bit: the
      # downloaded target/ carries every workspace bin as a 0644 file
      # and any spawn fails with EACCES (CI run 39468671027 legs 2+3:
      # "spawn .../target/debug/oc-server: Permission denied (os error
      # 13)"). Enumerate the bin names from the workspace manifests via
      # cargo metadata (no guessing) and restore ONLY target/debug/<bin>
      # — never a blanket chmod -R over the target dir.
      - name: Restore the exec bit on artifact-shipped binaries
        run: |
          set -euo pipefail
          BINS="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name')"
          if [ -z "$BINS" ]; then
            echo "::error::cargo metadata enumerated zero workspace bins — refusing to no-op the exec-bit restore"
            exit 1
          fi
          for bin in $BINS; do
            if [ -f "target/debug/$bin" ]; then
              chmod +x "target/debug/$bin"
              echo "exec bit restored: target/debug/$bin"
            fi
          done

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148

      # 18 tests (verified via nextest list): the vertex URL/auth surface
      # (AI-VERTEX-V2 / AI-V1 adjacent), the copilot wire surface
      # (AI-COPILOT-C6 adjacent). All hermetic (cassette/mock/unit).
      - name: Cassette/unit battery for the 3 AI rows
        run: >-
          cargo nextest run -p oc-ai --locked -E
          'test(base_urls_embed_project_location_and_publishers) or test(vertex_route_embeds_the_model_in_the_path_and_bears_the_token) or test(adc_env_token_resolves_at_apply_time) or test(express_mode_uses_the_api_key_header) or test(hosts_route_by_location) or test(tuned_endpoints_address_the_project_root) or test(location_falls_back_to_us_central1) or test(patching_the_provider_rekeys_the_metadata_namespace) or binary(copilot_responses) or test(copilot_wire_request_carries_the_client_headers_and_bearer) or test(default_base_url_and_github_token_env_fallback) or test(interaction_type_vocabulary_matches_the_copilot_client)'

      # --- live legs: skip must never look like a live pass ----------------
      # live=false (default): the old cassette-only semantics, minus the
      # stale "no live harness exists" text (the harness now exists in
      # tools/parity/tests/live_ai_probes.rs — it is just not requested).
      # LIVE-SKIP when secrets are missing; LIVE-AVAILABLE when they are
      # present but this dispatch did not ask for live.
      - name: AI-VERTEX-V2 live gate (not requested)
        if: ${{ inputs.live != true }}
        run: |
          if [ "${HAS_VERTEX_CREDS}" = "true" ]; then
            echo "::warning::LIVE-AVAILABLE (not requested): AI-VERTEX-V2 secrets present — dispatch with live=true to run the live probe battery (tools/parity/tests/live_ai_probes.rs). This run is cassette-only; NOT a live pass."
          else
            echo "::warning::LIVE-SKIP (secrets missing): AI-VERTEX-V2 — set OC_CI_VERTEX_PROJECT + OC_CI_VERTEX_CREDENTIALS (contract: this workflow's header). Cassette battery above is the only coverage; this is NOT a live pass."
          fi

      - name: AI-V1 live gate (not requested)
        if: ${{ inputs.live != true }}
        run: |
          if [ "${HAS_GEMINI_KEY}" = "true" ]; then
            echo "::warning::LIVE-AVAILABLE (not requested): AI-V1 secrets present — dispatch with live=true to run the live probe battery (tools/parity/tests/live_ai_probes.rs). This run is cassette-only; NOT a live pass."
          else
            echo "::warning::LIVE-SKIP (secrets missing): AI-V1 — set OC_CI_GEMINI_API_KEY (contract: this workflow's header). Cassette battery above is the only coverage; this is NOT a live pass."
          fi

      - name: AI-COPILOT-C6 live gate (not requested)
        if: ${{ inputs.live != true }}
        run: |
          if [ "${HAS_COPILOT_TOKEN}" = "true" ]; then
            echo "::warning::LIVE-AVAILABLE (not requested): AI-COPILOT-C6 secrets present — dispatch with live=true to run the live probe battery (tools/parity/tests/live_ai_probes.rs). This run is cassette-only; NOT a live pass."
          else
            echo "::warning::LIVE-SKIP (secrets missing): AI-COPILOT-C6 — set OC_CI_COPILOT_TOKEN (contract: this workflow's header). Cassette battery above is the only coverage; this is NOT a live pass."
          fi

      # live=true: an explicit live run without the full secret set is a
      # CONFIGURATION ERROR — fail loudly here (the probe battery itself
      # would also refuse via OC_CI_LIVE=1 + missing secrets, but failing
      # before running anything is the clearest signal). Only the env
      # HAS_* booleans are read here; the `secrets` context stays illegal
      # in `if:`/script expression positions (see the header NOTE).
      - name: Live battery gate (live=true requires all OC_CI_* secrets)
        if: ${{ inputs.live == true }}
        run: |
          set -euo pipefail
          missing=""
          [ "${HAS_VERTEX_CREDS}" = "true" ] || missing="${missing} OC_CI_VERTEX_PROJECT/OC_CI_VERTEX_CREDENTIALS"
          [ "${HAS_GEMINI_KEY}" = "true" ] || missing="${missing} OC_CI_GEMINI_API_KEY"
          [ "${HAS_COPILOT_TOKEN}" = "true" ] || missing="${missing} OC_CI_COPILOT_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::live=true was requested but these secrets are missing:${missing} — an explicit live run without credentials is a configuration error; refusing to go green. Set them (contract: this workflow's header) or dispatch with live=false."
            exit 1
          fi
          echo "live canary: all OC_CI_* secrets present — running tools/parity/tests/live_ai_probes.rs"

      # The live battery: each probe bails with a loud LIVE-SKIP if its own
      # secrets vanish mid-flight, fails under OC_CI_LIVE=1 with secrets
      # missing (config error), and classifies its failures
      # URL/AUTH/SHAPE/UPSTREAM/budget. Budgets: ≤60s/probe, ≤25s/request;
      # evidence (endpoint/time/status/shape, never credential values)
      # prints to the log. Secrets appear ONLY in this step's env VALUES.
      - name: Live probe battery (AI-VERTEX-V2 / AI-V1 / AI-COPILOT-C6)
        if: ${{ inputs.live == true }}
        run: cargo nextest run -p parity --locked --run-ignored only -E 'test(live_ai_)'
        env:
          OC_CI_LIVE: "1"
          OC_CI_VERTEX_PROJECT: ${{ secrets.OC_CI_VERTEX_PROJECT }}
          OC_CI_VERTEX_CREDENTIALS: ${{ secrets.OC_CI_VERTEX_CREDENTIALS }}
          OC_CI_GEMINI_API_KEY: ${{ secrets.OC_CI_GEMINI_API_KEY }}
          OC_CI_COPILOT_TOKEN: ${{ secrets.OC_CI_COPILOT_TOKEN }}

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### ai-needs-runtime"
            echo "- EXECUTED (cassette/unit, 18 tests): AI-VERTEX-V2 + AI-V1 via protocols::vertex::* (8 tests); AI-COPILOT-C6 via copilot_responses (7) + protocols::copilot::* (3)"
            if [ "${{ inputs.live }}" = "true" ]; then
              echo "- LIVE: EXECUTED — live_ai_probes battery (OC_CI_LIVE=1; a red probe fails this job: skip ≠ pass, red ≠ pass)"
            else
              echo "- LIVE: not requested (live=false) — see the ::warning lines above (LIVE-SKIP or LIVE-AVAILABLE; neither is a live pass)"
            fi
            echo "- GAP: the 3 ledger \`test\` names (cassette namesakes) match 0 tests — the rows are gated by the live probes + cassette battery instead"
          } >> "$GITHUB_STEP_SUMMARY"

  # The 6 TUI needs-runtime rows. Their ledger `test` names all match 0
  # tests (probed loudly below — evidence, not silence). The adjacent
  # serialized PTY daily-driver battery keeps real TUI behavior in the
  # loop WITHOUT pretending to cover the rows.
  tui-needs-runtime:
    name: "needs-runtime (TUI: 6 rows, gap probes + adjacent PTY battery)"
    needs: build-archive
    if: ${{ inputs.run_needs_runtime != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: runtime-gates-target
          path: target

      # upload-artifact@v4 does NOT preserve the executable bit: the
      # downloaded target/ carries every workspace bin as a 0644 file
      # and any spawn fails with EACCES (CI run 39468671027 legs 2+3:
      # "spawn .../target/debug/oc-server: Permission denied (os error
      # 13)"). Enumerate the bin names from the workspace manifests via
      # cargo metadata (no guessing) and restore ONLY target/debug/<bin>
      # — never a blanket chmod -R over the target dir.
      - name: Restore the exec bit on artifact-shipped binaries
        run: |
          set -euo pipefail
          BINS="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name')"
          if [ -z "$BINS" ]; then
            echo "::error::cargo metadata enumerated zero workspace bins — refusing to no-op the exec-bit restore"
            exit 1
          fi
          for bin in $BINS; do
            if [ -f "target/debug/$bin" ]; then
              chmod +x "target/debug/$bin"
              echo "exec bit restored: target/debug/$bin"
            fi
          done

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148

      - name: Probe the 6 TUI ledger selectors (expected 0 matches — GAP)
        run: |
          set -euo pipefail
          declare -A ROW=(
            [recents_ctrl_prompt_index]="TUI-28"
            [sessionlocatio_location]="TUI-30"
            [session_verbosity_cycle_index]="TUI-33"
            [scroll_anchor_restore]="TUI-TD06"
            [prompt_autosubmit_ready]="TUI-TD15"
            [pluginroutemis]="TUI-TD28"
          )
          for sel in "${!ROW[@]}"; do
            n="$(cargo nextest list --workspace --locked -E "test($sel)" | grep -c . || true)"
            n="${n:-0}"
            if [ "$n" -eq 0 ]; then
              echo "::warning::GAP (no test exists): ${ROW[$sel]} selector '$sel' matches 0 tests — needs-runtime row stays un-gated (skip ≠ pass)."
            else
              echo "::warning::UNEXPECTED: '${ROW[$sel]}' selector '$sel' now matches $n test(s) — wire it into this job's run step."
            fi
          done

      # Adjacent coverage only (9 tests): the serialized daily-driver PTY
      # battery. NOT a substitute for the 6 rows above.
      - name: Adjacent serialized PTY daily-driver battery
        run: cargo nextest run --workspace --locked --profile pty -E 'binary(pty_daily)'

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### tui-needs-runtime"
            echo "- EXECUTED (adjacent only): pty_daily battery (9 tests, serialized)"
            echo "- GAP (skip ≠ pass): TUI-28, TUI-30, TUI-33, TUI-TD06, TUI-TD15, TUI-TD28 — ledger \`test\` names match 0 tests; rows remain un-gated until the tests are authored"
          } >> "$GITHUB_STEP_SUMMARY"

  # Opt-in 30m soak. GAP, honestly: no single-session 30-minute TUI soak
  # harness exists; this wires the closest existing long-horizon surface —
  # a wall-clock-bounded cycle loop over kill-9 recovery + reconnect
  # resync. A red cycle fails the soak (set -e); cycles are counted.
  soak-30m:
    name: 30m soak (recovery + resync cycle loop)
    needs: build-archive
    if: ${{ inputs.run_soak_30m == true }}
    runs-on: ubuntu-latest
    # BOTH mitigations chosen (verifier defect 3): the cap is raised to 75
    # for headroom over the 30m loop, AND the loop guards cycle starts so
    # a cycle never starts inside the final 10 minutes of the window
    # (prints SOAK-CYCLE-SKIPPED-TIMEBOX instead). A red soak is therefore
    # always a test failure, never a job-cap TIMEOUT breach.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: runtime-gates-target
          path: target

      # upload-artifact@v4 does NOT preserve the executable bit: the
      # downloaded target/ carries every workspace bin as a 0644 file
      # and any spawn fails with EACCES (CI run 39468671027 legs 2+3:
      # "spawn .../target/debug/oc-server: Permission denied (os error
      # 13)"). Enumerate the bin names from the workspace manifests via
      # cargo metadata (no guessing) and restore ONLY target/debug/<bin>
      # — never a blanket chmod -R over the target dir.
      - name: Restore the exec bit on artifact-shipped binaries
        run: |
          set -euo pipefail
          BINS="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name')"
          if [ -z "$BINS" ]; then
            echo "::error::cargo metadata enumerated zero workspace bins — refusing to no-op the exec-bit restore"
            exit 1
          fi
          for bin in $BINS; do
            if [ -f "target/debug/$bin" ]; then
              chmod +x "target/debug/$bin"
              echo "exec bit restored: target/debug/$bin"
            fi
          done

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148

      - name: Soak loop (30 minutes of recovery + resync cycles)
        run: |
          set -euo pipefail
          END=$((SECONDS + 1800))
          CYCLES=0
          SKIPPED_BY_TIMEBOX=0
          while :; do
            REMAINING=$((END - SECONDS))
            if [ "$REMAINING" -le 0 ]; then
              break
            fi
            if [ "$REMAINING" -lt 600 ]; then
              # Timebox guard: never start a cycle that cannot finish
              # inside the job cap (conservative 10-minute budget).
              SKIPPED_BY_TIMEBOX=$((SKIPPED_BY_TIMEBOX + 1))
              echo "SOAK-CYCLE-SKIPPED-TIMEBOX (only ${REMAINING}s of the 30m window left; a cycle needs up to the 10-minute conservative budget)"
              break
            fi
            CYCLES=$((CYCLES + 1))
            echo "[soak] cycle $CYCLES starts at t=${SECONDS}s"
            cargo nextest run --workspace --locked -E 'binary(runtime_recovery) or binary(reconnect_resync)'
          done
          echo "[soak] completed $CYCLES cycles in ${SECONDS}s (timebox-guard skips: $SKIPPED_BY_TIMEBOX)"
          {
            echo "### soak-30m"
            echo "- EXECUTED: $CYCLES recovery+resync cycles over ${SECONDS}s (wall-clock bounded; timebox-guard skips: $SKIPPED_BY_TIMEBOX)"
            echo "- GAP: no single-session 30m TUI long-soak harness exists — this is the closest existing surface, not the §12.3 literal"
          } >> "$GITHUB_STEP_SUMMARY"

  # Opt-in release smoke (§12.4): build the release binary, then run the
  # committed script against it. The script self-sandboxes under
  # /tmp/opencode and asserts it never binds 49374 (CI is exempt from the
  # dev-gate but keeps the sandbox discipline).
  release-smoke:
    name: release smoke (build + tools/release-smoke.sh)
    needs: build-archive
    if: ${{ inputs.run_release_smoke == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: opencode-ci

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: actions/download-artifact@v4
        with:
          name: runtime-gates-target
          path: target

      # upload-artifact@v4 does NOT preserve the executable bit: the
      # downloaded target/ carries every workspace bin as a 0644 file
      # and any spawn fails with EACCES (CI run 39468671027 legs 2+3:
      # "spawn .../target/debug/oc-server: Permission denied (os error
      # 13)"). Enumerate the bin names from the workspace manifests via
      # cargo metadata (no guessing) and restore ONLY target/debug/<bin>
      # — never a blanket chmod -R over the target dir.
      - name: Restore the exec bit on artifact-shipped binaries
        run: |
          set -euo pipefail
          BINS="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name')"
          if [ -z "$BINS" ]; then
            echo "::error::cargo metadata enumerated zero workspace bins — refusing to no-op the exec-bit restore"
            exit 1
          fi
          for bin in $BINS; do
            if [ -f "target/debug/$bin" ]; then
              chmod +x "target/debug/$bin"
              echo "exec bit restored: target/debug/$bin"
            fi
          done

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148

      - name: Prepare scratch dir
        run: mkdir -p /tmp/opencode

      - name: Build the release binary
        run: cargo build --release -p oc-cli --locked

      - name: Release smoke
        run: tools/release-smoke.sh target/release/opencode-rust

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### release-smoke"
            echo "- EXECUTED: cargo build --release -p oc-cli + tools/release-smoke.sh (version banners, sandboxed serve on --port 0, FakeLlm run_e2e battery — 11 tests)"
          } >> "$GITHUB_STEP_SUMMARY"

  # §12.4 SURF-PLATFORM CI leg: a non-linux-x64 BUILD target. `cargo
  # build` (not `check`) on purpose: the exit criterion is a build target,
  # and linking + codegen on aarch64-apple-darwin is what proves it —
  # check would leave both unproven. No mac tests in this lane (§12.4
  # asks for a build target only). Compiles from source: the linux
  # archive is useless here, hence no `needs`.
  platform-build:
    name: build target (macos-latest, aarch64-apple-darwin)
    if: ${{ inputs.run_platform_build != false }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: opencode-ci

      - name: "Build the workspace (release-grade proof: link + codegen)"
        run: cargo build --workspace --locked

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### platform-build"
            echo "- EXECUTED: cargo build --workspace --locked on macos-latest (non-linux-x64 §12.4 CI leg)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Central EXECUTED vs SKIPPED ledger (loop §1: skip ≠ pass). Fails the
  # workflow when a gate the user asked for (toggle ON / default ON) did
  # not end green — including downstream-`skipped` after an upstream
  # failure, which plain `needs` would hide.
  gates-summary:
    name: gates summary (EXECUTED vs SKIPPED)
    needs: [build-archive, v2-db-fixture, p10-battery, runtime-gates, ai-needs-runtime, tui-needs-runtime, soak-30m, release-smoke, platform-build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: EXECUTED vs SKIPPED table
        run: |
          set -euo pipefail
          {
            echo "## runtime-gates — EXECUTED vs SKIPPED (skip ≠ pass)"
            echo "| gate | result | verdict |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          # gate:result:requested  (requested=1 means this run asked for it)
          rows="build-archive:${{ needs.build-archive.result }}:1"
          # v2-db-fixture gap is a verdict OVERRIDE: a green fixture job
          # that staged no db must read SKIPPED-GAP, not EXECUTED-green.
          if [ "${{ needs.v2-db-fixture.outputs.db_staged }}" = "gap" ]; then
            rows="$rows v2-db-fixture:skipped-gap:1"
          else
            rows="$rows v2-db-fixture:${{ needs.v2-db-fixture.result }}:1"
          fi
          rows="$rows p10-battery:${{ needs.p10-battery.result }}:${{ inputs.run_p10_battery != false && '1' || '0' }}"
          rows="$rows runtime-gates:${{ needs.runtime-gates.result }}:${{ inputs.run_runtime_gates != false && '1' || '0' }}"
          rows="$rows ai-needs-runtime:${{ needs.ai-needs-runtime.result }}:${{ inputs.run_needs_runtime != false && '1' || '0' }}"
          rows="$rows tui-needs-runtime:${{ needs.tui-needs-runtime.result }}:${{ inputs.run_needs_runtime != false && '1' || '0' }}"
          rows="$rows soak-30m:${{ needs.soak-30m.result }}:${{ inputs.run_soak_30m == true && '1' || '0' }}"
          rows="$rows release-smoke:${{ needs.release-smoke.result }}:${{ inputs.run_release_smoke == true && '1' || '0' }}"
          rows="$rows platform-build:${{ needs.platform-build.result }}:${{ inputs.run_platform_build != false && '1' || '0' }}"
          for row in $rows; do
            gate="${row%%:*}"; rest="${row#*:}"; res="${rest%%:*}"; req="${rest##*:}"
            verdict="UNKNOWN"
            case "$res:$req" in
              skipped-gap:*) verdict="SKIPPED-GAP (no v2 db staged; annotated — never a pass)" ;;
              success:*) verdict="EXECUTED-green" ;;
              failure:*|cancelled:*) verdict="EXECUTED-red"; fail=1 ;;
              skipped:1) verdict="SKIPPED-upstream-failure"; fail=1 ;;
              skipped:0) verdict="SKIPPED-by-input-toggle" ;;
            esac
            echo "| $gate | $res | $verdict |" >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo ""
            echo "Standing gaps (never count as passes): TUI-28/30/33/TD06/TD15/TD28 (no tests), AI live legs only when dispatched live=true WITHOUT the OC_CI_* secrets (config error, red), literal 30m single-session soak (cycle-loop approximation), v2-db-fixture GAP when present (db_import fails strict; census GAP-skips)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            echo "::error::at least one requested gate did not run green — see the table above"
            exit 1
          fi
