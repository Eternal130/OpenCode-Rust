[workspace]
resolver = "2"
members = [
    "crates/oc-util",
    "crates/oc-schema",
    "crates/oc-theme",
    "crates/oc-ai",
    "crates/oc-core",
    "crates/oc-syntax",
    "crates/oc-plugin-host",
    "crates/oc-server",
    "crates/oc-client",
    "crates/oc-tui",
    "crates/oc-tui-core",
    "crates/oc-cli",
    "tools/openapi-gen",
    "tools/parity",
]

[workspace.package]
version = "2.0.24"
edition = "2021"
license = "MIT"
repository = "https://github.com/Eternal130/OpenCode-Rust"

# Vendored ACP crates (R-03): identical to crates.io except
# serde_json's `preserve_order` feature is dropped — upstream enables it
# unconditionally and feature unification would flip the workspace's
# serde_json map ordering (see third_party/*/Cargo.toml notes).
[patch.crates-io]
agent-client-protocol = { path = "third_party/agent-client-protocol" }
agent-client-protocol-schema = { path = "third_party/agent-client-protocol-schema" }
# Vendored grammar (R-01b): toml v0.7.0
# (tree-sitter-grammars) carry no tree-sitter-language release on crates.io
# — see each third_party/*/README.md.
tree-sitter-toml = { path = "third_party/tree-sitter-toml" }

# ── OpenTUI local-dev patch (lane M0) ─────────────────────────────────────
# The opentui crates below are consumed as a pinned GitHub git dep; CI's
# clean checkout resolves them straight from the repo. For local dev
# velocity against the sibling checkout, UNCOMMENT this block to redirect
# all three crates to /opt/opentui-rust (edits there rebuild instantly):
#
# [patch.'https://github.com/Eternal130/opentui-rust']
# opentui-core = { path = "/opt/opentui-rust/crates/opentui-core" }
# opentui-keymap = { path = "/opt/opentui-rust/crates/opentui-keymap" }
# opentui-solid = { path = "/opt/opentui-rust/crates/opentui-solid" }
#
# The block MUST stay commented in the committed tree: cargo hard-errors
# on a [patch] path that does not exist (`patch location ... does not
# contain packages matching ...`), which would break CI. Note that with
# the patch active cargo rewrites Cargo.lock to the path sources — do not
# commit that churn; `git checkout -- Cargo.lock` after local patch runs.

[workspace.dependencies]
oc-util = { path = "crates/oc-util" }
oc-tui-core = { path = "crates/oc-tui-core" }
oc-schema = { path = "crates/oc-schema" }
oc-theme = { path = "crates/oc-theme" }
oc-ai = { path = "crates/oc-ai" }
oc-core = { path = "crates/oc-core" }
oc-syntax = { path = "crates/oc-syntax" }
oc-plugin-host = { path = "crates/oc-plugin-host" }
oc-server = { path = "crates/oc-server" }
oc-client = { path = "crates/oc-client" }
oc-tui = { path = "crates/oc-tui" }

# OpenTUI (lane M0): API-level port of @opentui/{core,keymap,solid}@0.5.14
# (github.com/Eternal130/opentui-rust) that the oc-tui migration
# consumes. Pinned to the reviewed main rev (74/74 differential green
# in that repo's CI). REAL deps of oc-tui since lane M1 (the session
# tab strip renders on opentui-solid; release size +1.17 MiB, measured
# in docs/migration-m1-tabstrip.md) — see the [patch] note above for
# local-dev redirection to /opt/opentui-rust.
opentui-core = { git = "https://github.com/Eternal130/opentui-rust.git", rev = "bee57dba0eb8c33a1868466953ab15e474313594" }
opentui-keymap = { git = "https://github.com/Eternal130/opentui-rust.git", rev = "bee57dba0eb8c33a1868466953ab15e474313594" }
opentui-solid = { git = "https://github.com/Eternal130/opentui-rust.git", rev = "bee57dba0eb8c33a1868466953ab15e474313594" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "2"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
