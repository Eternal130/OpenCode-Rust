[workspace]
resolver = "2"
members = [
    "crates/oc-util",
    "crates/oc-http",
    "crates/oc-schema",
    "crates/oc-theme",
    "crates/oc-ai",
    "crates/oc-core",
    "crates/oc-syntax",
    "crates/oc-plugin-host",
    "crates/oc-pty",
    "crates/oc-server",
    "crates/oc-client",
    "crates/oc-tui",
    "crates/oc-tui-core",
    "crates/oc-cli",
    "tools/openapi-gen",
    "tools/parity",
    "third_party/oc-uqr",
]

[workspace.package]
version = "2.0.24"
edition = "2021"
license = "MIT"
repository = "https://github.com/Eternal130/OpenCode-Rust"

# Vendored ACP crates (R-03): identical to crates.io except
# serde_json's `preserve_order` feature is dropped — upstream enables it
# unconditionally and feature unification would flip the workspace's
# serde_json map ordering (see third_party/*/Cargo.toml notes).
[patch.crates-io]
agent-client-protocol = { path = "third_party/agent-client-protocol" }
agent-client-protocol-schema = { path = "third_party/agent-client-protocol-schema" }
# Vendored grammar (R-01b): toml v0.7.0
# (tree-sitter-grammars) carry no tree-sitter-language release on crates.io
# — see each third_party/*/README.md.
tree-sitter-toml = { path = "third_party/tree-sitter-toml" }

[workspace.dependencies]
oc-util = { path = "crates/oc-util" }
oc-http = { path = "crates/oc-http" }
oc-tui-core = { path = "crates/oc-tui-core" }
oc-schema = { path = "crates/oc-schema" }
oc-theme = { path = "crates/oc-theme" }
oc-ai = { path = "crates/oc-ai" }
oc-core = { path = "crates/oc-core" }
oc-syntax = { path = "crates/oc-syntax" }
oc-plugin-host = { path = "crates/oc-plugin-host" }
oc-pty = { path = "crates/oc-pty" }
oc-server = { path = "crates/oc-server" }
oc-client = { path = "crates/oc-client" }
oc-tui = { path = "crates/oc-tui" }
oc-uqr = { path = "third_party/oc-uqr" }

# OpenTUI (lane M0): API-level port of @opentui/{core,keymap,solid}@0.5.14
# (github.com/Eternal130/opentui-rust) that the oc-tui migration
# consumes. Pinned to the reviewed main rev (74/74 differential green
# in that repo's CI). REAL deps of oc-tui since lane M1 (the session
# tab strip renders on opentui-solid; release size +1.17 MiB, measured
# in docs/migration-m1-tabstrip.md). Local-path [patch] redirection
# removed 2026-10-24 (GAPS G-11): opentui changes flow via git rev bumps
# only. Rev 4ff646d adds the terminal-backend feature (Phase A of the
# full-render migration, docs/PLAN-opentui-render-migration.md): TTY
# seam, mode sequences, capability probe, input/output pumps, resize
# watch, teardown/scrollback epilogue, OSC 8 — default builds of the
# port remain headless-pure (113 differential scenarios IDENTICAL).
# Rev 8cbd53d adds TextTableRenderable wired into markdown (tables
# render as a real grid, not raw text; 3 new differential scenarios
# IDENTICAL) — closes GAPS G-177.
# Rev d1ef96d adds the remaining Phase C parity items: TextBuffer
# truncate/scissor/scroll semantics (composer/scrollback benefit;
# 3 more scenarios, suite at 119 IDENTICAL), the image.ts family +
# ImageRenderable contract (unit-pinned — image bytes are not
# cell-grid observable), and the kitty-graphics teardown gate
# (inert without an image session).
# Rev d3688d8 adds the live CliRenderer (terminal-backend feature,
# Phase B of docs/PLAN-opentui-render-migration.md): frame scheduling
# ownership via attach_terminal_session/request_render/run_frame/settle/
# destroy — consumed by oc-tui lane D2.1b to own the render loop while
# GridEmitter stays the sole byte emitter (byte-for-byte unchanged).
# Rev 54dbb4d adds EmbeddedTerminalRenderable/EmbeddedTerminalState
# (lane D3-3a): the vte-backed VT engine folded from oc-tui's
# terminal_pane.rs (grid, scrollback, selection, key/paste encoders,
# mouse forwarding, OSC 4/104/10/11 palette injection) with its
# upstream-API contract tests + PTY grid parity against the vt100
# oracle. Consumed by oc-tui lane D3-3b: terminal_pane's local vt100
# VT face retires; the attach/stream machine stays with the consumer.
# Rev 71f07e1 adds the native image family (lane D3-4a): drawImage/
# ImageFrameEmitter in opentui-core with kitty/sixel/blocks encoders,
# protocol="auto" driven by TerminalCapabilities (kitty-graphics probe
# plus cell-pixel resolution), occlusion flattening and image_deletes.
# Consumed by oc-tui lane D3-4b: the local image/ family (protocol
# detection, kitty/sixel emitters, halfblock raster) retires.
# Rev e52adf6 (lane D4.1c-pre) adds the split-footer footer-domain
# render path: calculate_render_geometry (footer-band layout +
# renderOffset emission), the footer frame's ?2026 pump drain,
# set_footer_height (runtime dock re-geometry), and solid
# render_into/dispose_root/with_renderer (mount a solid component
# onto the renderer's root tree). Consumed by oc-tui lane D4.1c:
# mini footer content rides the renderer root tree; the dock's
# Canvas→into_frame→GridEmitter path and the "never pump" ruling
# retire (mini frame bytes flow through the renderer pump exit).
opentui-core = { git = "https://github.com/Eternal130/opentui-rust.git", rev = "56a9eda" }
opentui-keymap = { git = "https://github.com/Eternal130/opentui-rust.git", rev = "56a9eda" }
opentui-solid = { git = "https://github.com/Eternal130/opentui-rust.git", rev = "56a9eda" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "2"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
