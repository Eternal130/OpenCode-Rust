[package]
name = "oc-ai"
description = "opencode LLM SDK: event contract, route composition, protocol state machines, cassette replay"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["reqwest-transport"]
# Process-agnostic HTTP transport backed by reqwest. The route/protocol layer
# only sees the `Transport` trait (raw byte streams); nothing reqwest-shaped
# leaks into protocol or route signatures.
reqwest-transport = ["dep:reqwest"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
bytes = "1"
regex = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "stream",
    "json",
    "rustls-tls",
] }

[dev-dependencies]
tokio = { workspace = true }
