[package]
name = "oc-ai"
description = "opencode LLM SDK: event contract, route composition, protocol state machines, cassette replay"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["reqwest-transport", "ws-transport"]
# Process-agnostic HTTP transport backed by reqwest. The route/protocol layer
# only sees the `Transport` trait (raw byte streams); nothing reqwest-shaped
# leaks into protocol or route signatures.
reqwest-transport = ["dep:reqwest", "dep:oc-http"]
# WebSocket channel transport (openai-responses WS path, AI-M1): connector +
# channel executor machinery; `ws-transport` adds the production
# tokio-tungstenite connector. The channel types themselves always build.
ws-transport = ["dep:tokio-tungstenite", "dep:tokio-rustls", "dep:webpki-roots", "dep:tokio-socks"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
bytes = "1"
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
# "net"/"io-util" also back the WS proxy CONNECT tunnel (route/transport/proxy.rs).
tokio = { version = "1", default-features = false, features = [
    "sync",
    "macros",
    "rt",
    "time",
    "net",
    "io-util",
] }
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "stream",
    "json",
    "rustls-tls",
] }
# G-26: platform-verifier TLS trust for the reqwest transport's clients.
oc-http = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.24", optional = true, default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "aws_lc_rs"], optional = true }
webpki-roots = { version = "1", optional = true }
tokio-socks = { version = "0.5", optional = true }

[dev-dependencies]
tokio = { workspace = true }
sha1 = "0.10"
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
] }
rcgen = "0.14.10"
