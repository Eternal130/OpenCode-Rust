[package]
name = "oc-cli"
description = "opencode CLI entry binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opencode-rust"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
oc-core = { workspace = true }
oc-schema = { workspace = true }
oc-util = { workspace = true }
oc-client = { workspace = true }
oc-server = { workspace = true }
oc-plugin-host = { workspace = true }
oc-tui = { path = "../oc-tui" }
oc-ai = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
base64 = "0.22"
rand = "0.8"
dirs = "5"
libc = "0.2"
dialoguer = "0.11"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
sha1 = "0.10"
json5 = "0.4"
agent-client-protocol = { version = "=3.3.0", features = ["stdio", "unstable_session_fork"] }

[dev-dependencies]
tempfile = "3"
