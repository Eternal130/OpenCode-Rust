[package]
name = "oc-cli"
description = "opencode CLI entry binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opencode-rust"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
oc-core = { workspace = true }
oc-schema = { workspace = true }
oc-util = { workspace = true }
# G-26: unified platform TLS trust for the reqwest 0.12 HTTP stack.
oc-http = { workspace = true }
oc-client = { workspace = true }
oc-uqr = { workspace = true }
oc-server = { workspace = true }
oc-plugin-host = { workspace = true }
oc-tui = { path = "../oc-tui" }
oc-ai = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
base64 = "0.22"
rand = "0.8"
libc = "0.2"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
# G-150: form-field pattern validation (ref answerForm `new RegExp`).
regex = "1"
# `session list` local-timezone timestamps (toLocaleString parity; same
# approach as the oc-server stats handler, which documents why jiff).
jiff = "0.2"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
json5 = "0.4"
agent-client-protocol = { version = "=3.3.0", features = ["stdio", "unstable_session_fork"] }

[dev-dependencies]
tempfile = "3"
