[package]
name = "oc-core"
description = "opencode core engine: db, bus, session runner, tools, permissions, hooks"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oc-util = { workspace = true }
# G-26: unified platform TLS trust for the reqwest 0.12 HTTP stack.
oc-http = { workspace = true }
oc-schema = { workspace = true }
oc-ai = { workspace = true }
tokio = { workspace = true }
# rmcp's RequestContext cancellation token (elicitation abort race); the
# version rmcp 3.7 itself uses (already in the lock).
tokio-util = { version = "0.7", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
parking_lot = "0.12"
dashmap = "6"
notify = "6"
walkdir = "2"
serde_yaml = "0.9"
json5 = "0.4"
git2 = { version = "0.19", default-features = false }
rand = "0.8"
sha2 = "0.10"
# CRED-V3: RS256 self-signed JWT grants for service-account ADC files.
# ring 0.17 is already in the workspace lock (rustls); depending on it
# directly adds no new packages and brings the audited RSA signer.
ring = "0.17"
base64 = "0.22"
# RV-G3: model-input image limits/autoResize — decode + Lanczos3 resize +
# PNG/JPEG re-encode (REF photon WASM equivalent). Only new dep for the lane.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# rmcp 3.7's built-in StreamableHttpClient impl is compiled against reqwest
# 0.13; the MCP transport needs that exact client type while the rest of the
# workspace stays on 0.12 (both wrap the same `http` crate, so header types
# interoperate). TLS trust is UNIFIED across both stacks (G-26): 0.13 wires
# rustls-platform-verifier natively, and the 0.12 stack routes all client
# construction through the `oc-http` crate, which pre-configures the same
# rustls-platform-verifier (OS trust store — enterprise self-signed CAs
# behave identically on both stacks; webpki roots remain only as oc-http's
# no-system-store fallback).
reqwest13 = { package = "reqwest", version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "0.26"
rmcp = { version = "3.7.0", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "auth", "elicitation"] }
# G-223: the `StreamableHttpClient` impl seam needs `sse_stream::Sse` (the
# stream element type rmcp's trait uses but does not re-export); same
# version rmcp 3.7 itself resolves.
sse-stream = "0.2"
portable-pty = "0.8"
# Pinned to 0.15 like oc-tui (0.16 pulls unicode-width ^0.2.1, which
# cannot unify with the rest of the workspace — see oc-tui's Cargo.toml).
vt100 = "0.15"
urlencoding = "2"
libc = "0.2"
# G-85 — read tool alternatePath NFC canonicalization (read.ts:139-143).
unicode-normalization = "0.1.26"

# TransportRequest bodies (`bytes::Bytes`, dev-only before clippy round)
bytes = "1"
[dev-dependencies]
tempfile = "3"
# G-285②: the snowflake fake-stream route test builds a transport body.
async-stream = "0.3"
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
] }
