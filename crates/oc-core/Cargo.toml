[package]
name = "oc-core"
description = "opencode core engine: db, bus, session runner, tools, permissions, hooks"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oc-util = { workspace = true }
oc-schema = { workspace = true }
oc-ai = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
parking_lot = "0.12"
dashmap = "6"
notify = "6"
glob = "0.3"
walkdir = "2"
serde_yaml = "0.9"
json5 = "0.4"
git2 = { version = "0.19", default-features = false }
once_cell = "1"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "0.26"
rmcp = { version = "0.5", features = ["client", "transport-child-process", "transport-streamable-http-client", "auth"] }
portable-pty = "0.8"
urlencoding = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
