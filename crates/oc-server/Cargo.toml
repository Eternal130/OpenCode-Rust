[package]
name = "oc-server"
description = "opencode HTTP server: openapi routes, SSE, auth, pty ws, static assets"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# RW-06: OTel telemetry skeleton (port of util observability.ts/otlp.ts).
# DEFAULT OFF — the release build must not pull any otel/tracing crates
# (verified via `cargo tree -e features --no-default-features` in the
# lane log). Enabled only for explicit telemetry builds.
otel = [
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tonic",
]

[dependencies]
oc-ai = { workspace = true }
oc-core = { workspace = true }
oc-schema = { workspace = true }
oc-util = { workspace = true }
oc-client = { workspace = true }
oc-plugin-host = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br", "set-header"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
dashmap = "6"
subtle = "2"
libc = "0.2"
# R-04: the web-UI archive is decompressed at runtime only — compression
# happens in CI (tools/web-assets/package.ts, node:zlib brotli). This is
# the lighter decompress-only crate (already a transitive lock entry via
# tower-http's compression-br).
brotli-decompressor = "6"
# RV-B8: stats day bucketing by the session's IANA timezone (REF stats.ts
# `makeDateKey` uses Intl with `timeZone`). jiff bundles the tz database.
jiff = "0.2"
# RW-06 `otel` feature only (default OFF): OTLP span exporter skeleton.
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.31", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
opentelemetry = { version = "0.30", optional = true }
opentelemetry-otlp = { version = "0.30", optional = true, features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.30", optional = true, features = ["rt-tokio"] }
# Matches opentelemetry-otlp 0.30's tonic (must be the same minor to
# build the exporter's MetadataMap).
tonic = { version = "0.13", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"
oc-tui = { workspace = true }
# In-test fixture compression (app-archive round-trip + serving parity
# tests) — same crate the CI-equivalent quality (q6) exercises. Already
# a transitive lock entry; dev-only.
brotli = "9"
