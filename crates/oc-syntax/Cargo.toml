[package]
name = "oc-syntax"
description = "tree-sitter syntax highlighting engine for fenced code blocks (native grammars, vendored queries)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oc-theme = { workspace = true }
ratatui = "0.29"
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.23.1"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml = "0.7.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-diff = "0.1.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.25.1"
# G-08 tail languages (ref pins: lua v0.5.0, scala v0.24.0, make
# v1.1.1, vim v0.8.1). lua/scala/make crates.io releases sit exactly at
# the ref tags with tree-sitter-language 0.1 bindings; vim's crates.io
# release is stale, so the pin is vendored under third_party/.
tree-sitter-lua = "=0.5.0"
# Pinned exact: 0.24.1 grammar drifted; loosening requires re-vendoring the scala-highlights.scm query (ref pin: v0.24.0).
tree-sitter-scala = "=0.24.0"
tree-sitter-make = "=1.1.1"
tree-sitter-vim = { path = "../../third_party/tree-sitter-vim" }

# RA-07: the 14 default-on language-gap closes (ref pins where they
# exist on crates.io; queries vendored at the same tags under
# oc-syntax/queries/). markdown uses the tree-sitter-md split crate
# (block + inline grammars; no injection support — code-fence inner
# languages render plain). hcl v1.1.0 ships no queries in its repo, so
# the nvim-treesitter hcl highlights (the ref's own route,
# parsers-config.ts:180-187) are vendored. vue is vendored under
# third_party/ (the anomalyco fork never published to crates.io).
tree-sitter-bash = "=0.25.0"
tree-sitter-julia = "=0.23.1"
tree-sitter-elixir = "=0.3.5"
tree-sitter-xml = "=0.7.0"
tree-sitter-agda = "=1.3.3"
tree-sitter-r = "=1.2.0"
tree-sitter-hcl = "=1.1.0"
tree-sitter-haskell = "=0.23.1"
tree-sitter-ocaml = "=0.24.2"
tree-sitter-fsharp = "=0.3.0"
tree-sitter-clojure = "=0.1.0"
tree-sitter-nix = "=0.3.0"
tree-sitter-md = "=0.5.4"
tree-sitter-vue = { path = "../../third_party/tree-sitter-vue" }

# RA-07: the three grammars R-01b dropped for release-binary size
# (ROADMAP R-01b: 72.7 MiB vs the 67.6 ceiling), re-added BEHIND
# non-default cargo features so the default release binary is
# unchanged. kotlin's same-tag crates.io release still binds
# old-style tree-sitter, so its pin is vendored under third_party/.
tree-sitter-swift = { version = "=0.7.1", optional = true }
tree-sitter-c-sharp = { version = "=0.23.1", optional = true }
tree-sitter-kotlin = { path = "../../third_party/tree-sitter-kotlin", optional = true }

[features]
default = []
lang-swift = ["dep:tree-sitter-swift"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-kotlin = ["dep:tree-sitter-kotlin"]

[dev-dependencies]
serde_json = { workspace = true }
