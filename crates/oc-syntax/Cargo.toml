[package]
name = "oc-syntax"
description = "tree-sitter syntax highlighting engine for fenced code blocks (native grammars, vendored queries)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oc-theme = { workspace = true }
ratatui = "0.29"
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.23.1"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml = "0.7.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-diff = "0.1.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.25.1"
# G-08 tail languages (ref pins: lua v0.5.0, scala v0.24.0, make
# v1.1.1, vim v0.8.1). lua/scala/make crates.io releases sit exactly at
# the ref tags with tree-sitter-language 0.1 bindings; vim's crates.io
# release is stale, so the pin is vendored under third_party/.
tree-sitter-lua = "=0.5.0"
# Pinned exact: 0.24.1 grammar drifted; loosening requires re-vendoring the scala-highlights.scm query (ref pin: v0.24.0).
tree-sitter-scala = "=0.24.0"
tree-sitter-make = "=1.1.1"
tree-sitter-vim = { path = "../../third_party/tree-sitter-vim" }

# RA-07: the language-gap closes. SIZE RULING: default-on measurement
# came out at 128,169,600 B (122.3 MiB) vs the 82,507,456 B default
# baseline — +43.7 MiB, far past the 67.6 MiB ceiling — so ALL new
# grammars ship behind non-default cargo features and the default
# release binary is unchanged. `langs-extra` carries the 14 mainstream
# adds (ref pins where they exist on crates.io; queries vendored at
# the same tags under oc-syntax/queries/). markdown uses the
# tree-sitter-md split crate (block + inline grammars; no injection
# support — code-fence inner languages render plain). hcl v1.1.0 ships
# no queries in its repo, so the nvim-treesitter hcl highlights (the
# ref's own route, parsers-config.ts:180-187) are vendored. vue is
# vendored under third_party/ (the anomalyco fork never published to
# crates.io).
tree-sitter-bash = { version = "=0.25.0", optional = true }
tree-sitter-julia = { version = "=0.23.1", optional = true }
tree-sitter-elixir = { version = "=0.3.5", optional = true }
tree-sitter-xml = { version = "=0.7.0", optional = true }
tree-sitter-agda = { version = "=1.3.3", optional = true }
tree-sitter-r = { version = "=1.2.0", optional = true }
tree-sitter-hcl = { version = "=1.1.0", optional = true }
tree-sitter-haskell = { version = "=0.23.1", optional = true }
tree-sitter-ocaml = { version = "=0.24.2", optional = true }
tree-sitter-fsharp = { version = "=0.3.0", optional = true }
tree-sitter-clojure = { version = "=0.1.0", optional = true }
tree-sitter-nix = { version = "=0.3.0", optional = true }
tree-sitter-md = { version = "=0.5.4", optional = true }
tree-sitter-vue = { path = "../../third_party/tree-sitter-vue", optional = true }

# RA-07: the three grammars R-01b dropped for release-binary size
# (ROADMAP R-01b: 72.7 MiB vs the 67.6 ceiling), re-added BEHIND
# non-default cargo features so the default release binary is
# unchanged. kotlin's same-tag crates.io release still binds
# old-style tree-sitter, so its pin is vendored under third_party/.
tree-sitter-swift = { version = "=0.7.1", optional = true }
tree-sitter-c-sharp = { version = "=0.23.1", optional = true }
tree-sitter-kotlin = { path = "../../third_party/tree-sitter-kotlin", optional = true }

[features]
default = []
# The 14 mainstream RA-07 adds (15 registry entries: markdown-inline
# rides the markdown split parser's inline half).
langs-extra = [
    "dep:tree-sitter-bash",
    "dep:tree-sitter-julia",
    "dep:tree-sitter-elixir",
    "dep:tree-sitter-xml",
    "dep:tree-sitter-agda",
    "dep:tree-sitter-r",
    "dep:tree-sitter-hcl",
    "dep:tree-sitter-haskell",
    "dep:tree-sitter-ocaml",
    "dep:tree-sitter-fsharp",
    "dep:tree-sitter-clojure",
    "dep:tree-sitter-nix",
    "dep:tree-sitter-md",
    "dep:tree-sitter-vue",
]
# The three R-01b size drops.
lang-swift = ["dep:tree-sitter-swift"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-kotlin = ["dep:tree-sitter-kotlin"]
# Everything: all 37 ref languages register.
all-languages = ["langs-extra", "lang-swift", "lang-csharp", "lang-kotlin"]

[dev-dependencies]
serde_json = { workspace = true }
