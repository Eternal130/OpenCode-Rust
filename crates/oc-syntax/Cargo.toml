[package]
name = "oc-syntax"
description = "tree-sitter syntax highlighting engine for fenced code blocks (native grammars, vendored queries)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oc-theme = { workspace = true }
ratatui = "0.29"
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.23.1"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml = "0.7.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-diff = "0.1.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.25.1"
# G-08 tail languages (ref pins: lua v0.5.0, scala v0.24.0, make
# v1.1.1, vim v0.8.1). lua/scala/make crates.io releases sit exactly at
# the ref tags with tree-sitter-language 0.1 bindings; vim's crates.io
# release is stale, so the pin is vendored under third_party/.
tree-sitter-lua = "=0.5.0"
# Pinned exact: 0.24.1 grammar drifted; loosening requires re-vendoring the scala-highlights.scm query (ref pin: v0.24.0).
tree-sitter-scala = "=0.24.0"
tree-sitter-make = "=1.1.1"
tree-sitter-vim = { path = "../../third_party/tree-sitter-vim" }

[dev-dependencies]
serde_json = { workspace = true }
