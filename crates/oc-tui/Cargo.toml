[package]
name = "oc-tui"
description = "opencode terminal UI (ratatui + taffy): theme wiring, keymap, components"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oc-util = { workspace = true }
oc-tui-core = { workspace = true }
oc-theme = { workspace = true }
oc-syntax = { workspace = true }
oc-client = { workspace = true }
oc-core = { workspace = true }
oc-plugin-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
json5 = "0.4"
async-trait = "0.1"
ratatui = "0.29"
flate2 = "1.1"
taffy = { version = "0.9", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
crossterm = "0.28"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
# TUI-15 (lane-tui): Zed's editor-context sqlite, READ-ONLY — the same
# version + bundled feature oc-core already builds (feature unification
# reuses the lock's libsqlite3-sys; no new packages).
rusqlite = { version = "0.32", features = ["bundled"] }
# TUI-4 (lane-tui2): the embedded TerminalPane's VT emulator. Already
# a lock entry (the PTY test harness's parser) — the pane promotes it
# to a real dependency; no new packages enter the lock.
vt100 = "0.15"
# TUI-4: the persistent-pty attach WebSocket (the WS client the
# generated HTTP client deliberately leaves outside oc-client —
# "WS clients live outside this crate"). Same pinned version/feature
# set as oc-ai's dev-dep usage; plain ws:// (the TUI always talks to
# its local server over loopback http).
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
] }
futures = "0.3"
# Lane M1 (换血 pilot): the opentui trio moves from dev-dependencies
# to REAL dependencies — session_tabs_solid renders the tab strip on
# opentui-solid behind OC_TABS_OPENTUI=1 (default off; the hand-rolled
# renderer stays the default for one release). First surface whose
# release graph links opentui: release size delta measured in the lane
# report (M0's dev-only baseline was 64,659,904 B).
opentui-core = { workspace = true }
opentui-solid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Lane P2-sound: in-process playback parity. The vendored miniaudio sys
# crate (path-only, cc-built, runtime-dlopen ALSA/Pulse — same engine v2's
# native audio layer uses) is a Linux-only dependency: on other targets the
# sound channel keeps the system-player spawn mirror.
[target.'cfg(target_os = "linux")'.dependencies]
miniaudio-sys = { path = "../../third_party/miniaudio-sys" }

[dev-dependencies]
opentui-keymap = { workspace = true }
parity = { path = "../../tools/parity" }
tokio = { workspace = true }
oc-plugin-host = { workspace = true }
# TUI-15: the pty proof's Zed sqlite fixture writer (same version +
# features as the lib's real dependency — no new lock entries).
rusqlite = { version = "0.32", features = ["bundled"] }
# Cell-grid stream harness (tests/vt_harness.rs): parses the PTY's raw
# ANSI byte stream into styled cell grids over time. Pinned to 0.15:
# vt100 0.16 pulls unicode-width ^0.2.1, which cannot unify with
# ratatui 0.29's exact "=0.2.0" pin (0.15's unicode-width 0.1 coexists
# in the lock already, like console's).
