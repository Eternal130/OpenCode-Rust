[package]
name = "oc-tui"
description = "opencode terminal UI (ratatui + taffy): theme wiring, keymap, components"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oc-util = { workspace = true }
oc-tui-core = { workspace = true }
oc-theme = { workspace = true }
oc-syntax = { workspace = true }
oc-client = { workspace = true }
oc-plugin-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
json5 = "0.4"
async-trait = "0.1"
ratatui = "0.29"
flate2 = "1.1"
taffy = { version = "0.9", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
crossterm = "0.28"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
parity = { path = "../../tools/parity" }
tokio = { workspace = true }
oc-plugin-host = { workspace = true }
