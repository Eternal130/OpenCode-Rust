[package]
name = "oc-tui"
description = "opencode terminal UI (ratatui + taffy): theme wiring, keymap, components"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oc-util = { workspace = true }
oc-tui-core = { workspace = true }
oc-theme = { workspace = true }
oc-syntax = { workspace = true }
oc-client = { workspace = true }
oc-plugin-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
json5 = "0.4"
async-trait = "0.1"
ratatui = "0.29"
flate2 = "1.1"
taffy = { version = "0.9", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
crossterm = "0.28"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
# Lane M1 (换血 pilot): the opentui trio moves from dev-dependencies
# to REAL dependencies — session_tabs_solid renders the tab strip on
# opentui-solid behind OC_TABS_OPENTUI=1 (default off; the hand-rolled
# renderer stays the default for one release). First surface whose
# release graph links opentui: release size delta measured in the lane
# report (M0's dev-only baseline was 64,659,904 B).
opentui-core = { workspace = true }
opentui-keymap = { workspace = true }
opentui-solid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
parity = { path = "../../tools/parity" }
tokio = { workspace = true }
oc-plugin-host = { workspace = true }
# Cell-grid stream harness (tests/vt_harness.rs): parses the PTY's raw
# ANSI byte stream into styled cell grids over time. Pure Rust (vte +
# utf8parse, no build scripts) — compiles clean under the pinned
# toolchain. Pinned to 0.15: vt100 0.16 pulls unicode-width ^0.2.1,
# which cannot unify with ratatui 0.29's exact "=0.2.0" pin (0.15's
# unicode-width 0.1 coexists in the lock already, like console's).
vt100 = "0.15"
