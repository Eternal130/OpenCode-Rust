[package]
name = "oc-tui"
description = "opencode terminal UI (opentui + taffy): theme wiring, keymap, components"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oc-util = { workspace = true }
oc-uqr = { workspace = true }
oc-tui-core = { workspace = true }
oc-theme = { workspace = true }
oc-syntax = { workspace = true }
oc-client = { workspace = true }
oc-core = { workspace = true }
oc-plugin-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", default-features = false }
json5 = "0.4"
async-trait = "0.1"
# F1 (ref1): the stats activity calendar extracts LOCAL date fields
# (ref's `Date.getFullYear/getMonth/getDate`) — same tz-database
# approach as oc-server/oc-cli stats (jiff bundles the tz db).
jiff = "0.2"
flate2 = "1.1"
taffy = { version = "0.9", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
# TUI-15 (lane-tui): Zed's editor-context sqlite, READ-ONLY — the same
# version + bundled feature oc-core already builds (feature unification
# reuses the lock's libsqlite3-sys; no new packages).
rusqlite = { version = "0.32", features = ["bundled"] }
# TUI-4 (lane-tui2): the embedded TerminalPane's VT emulator moved to
# opentui's EmbeddedTerminal (lane D3-3b) — vt100 stays a DEV-dependency
# only (the PTY harness's oracle).
# TUI-4: the persistent-pty attach WebSocket (the WS client the
# generated HTTP client deliberately leaves outside oc-client —
# "WS clients live outside this crate"). Same pinned version/feature
# set as oc-ai's dev-dep usage; plain ws:// (the TUI always talks to
# its local server over loopback http).
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
] }
futures = "0.3"
# SURF-LATEX-MERMAID: grapheme segmentation for the LaTeX/mermaid text
# measurement (upstream uses Intl.Segmenter / string-width). Already a
# lock entry — no new packages.
unicode-segmentation = "1"
# Lane M1 (换血 pilot): the opentui trio moves from dev-dependencies
# to REAL dependencies — session_tabs_solid renders the tab strip on
# opentui-solid behind OC_TABS_OPENTUI=1 (default off; the hand-rolled
# renderer stays the default for one release). First surface whose
# release graph links opentui: release size delta measured in the lane
# report (M0's dev-only baseline was 64,659,904 B).
# SOUND-CONV: `device-audio` turns on opentui-core's real miniaudio
# playback device (rev 18e2904) — sound/audio.rs plays through it
# (Linux); the local vendored miniaudio-sys twin was deleted.
# terminal-backend (rev 4ff646d, Phase A): TTY seam + mode sequences +
# capability probe + input/output pumps + resize/teardown — the lane B3
# cutover consumes it; compiling it in early keeps the baseline honest.
opentui-core = { workspace = true, features = ["device-audio", "terminal-backend"] }
opentui-solid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
opentui-keymap = { workspace = true }
parity = { path = "../../tools/parity" }
# Lane TB (dual-engine tree gate): the standing test rebuilds the
# captured tree scenarios through opentui's own tree desugarer +
# scenario replayer and compares against the frozen TS-oracle frames
# (tools/parity/tree-scenarios/oracle/). Same rev as the lib deps —
# the desugarer must not drift from the harness that froze them.
opentui-diff = { git = "https://github.com/Eternal130/opentui-rust.git", rev = "56a9eda" }
tokio = { workspace = true }
oc-plugin-host = { workspace = true }
# TUI-15: the pty proof's Zed sqlite fixture writer (same version +
# features as the lib's real dependency — no new lock entries).
rusqlite = { version = "0.32", features = ["bundled"] }
# Cell-grid stream harness (tests/vt_harness.rs): parses the PTY's raw
# ANSI byte stream into styled cell grids over time. Pinned to 0.15:
# 0.16 pulls unicode-width ^0.2.1, which would force the lib's own
# unicode-width floor up (0.15's unicode-width 0.1 coexists in the
# lock already, like console's).
vt100 = "0.15"
