# Vendored grammar crate (R-01b) — see README.md for provenance.
# Identical in shape to the crates.io `tree-sitter-kotlin` 0.3.8 release
# except the bindings are regenerated for `tree-sitter-language` 0.1
# (the 0.3.8 release predates that crate; its `tree-sitter` dep is
# pinned to the incompatible 0.22 line).
[package]
name = "tree-sitter-kotlin"
description = "kotlin grammar for tree-sitter (vendored at tag 0.3.8)"
version = "0.3.8"
edition = "2021"
license = "MIT"
links = "tree_sitter_kotlin"

[lib]
path = "lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"
