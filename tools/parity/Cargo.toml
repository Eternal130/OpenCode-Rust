[package]
name = "parity"
description = "parity harness vs reference v2.0.24: normalization, golden compare"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oc-util = { workspace = true }
anyhow.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# SCAN-AB instrument repair: rescan-tui.rs (the I5-bound plugin-armed
# live-capture driver) references parity::tui_diff, removed by 07e0e06's
# paradigm ruling while the rescan lane's driver (7f84d13) still imports it
# — the standing instrument was compile-broken on main. Restored verbatim
# from 07e0e06^ (same vt100 0.15 pin as oc-tui's vt harness).
vt100 = "0.15"

[dev-dependencies]
tempfile = "3"
# Phase-10 battery (2b: Rust client ↔ reference server). Dev-only: the
# default suite never links it, keeping plain `cargo build -p parity` light.
oc-client = { workspace = true }
# DB-D12: in-process v1 content-migration regression (p10_db_import::
# v1_content_migration) against oc-core's database + v1_migration module.
oc-core = { workspace = true }
# DB-D12: building the pre-split "opencode-next.db" fixture (exact reference
# DDL — table `session`, not `session_v2`), mirroring the ref test's
# `bun:sqlite` usage. Dev-only.
rusqlite = { version = "0.32", features = ["bundled"] }
