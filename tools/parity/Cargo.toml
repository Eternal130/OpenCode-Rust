[package]
name = "parity"
description = "parity harness vs reference v2.0.24: normalization, golden compare"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oc-util = { workspace = true }
anyhow.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
vt100 = "0.15"

[[bin]]
name = "tui-diff"
path = "src/bin/tui-diff.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Phase-10 battery (2b: Rust client ↔ reference server). Dev-only: the
# default suite never links it, keeping plain `cargo build -p parity` light.
oc-client = { workspace = true }
